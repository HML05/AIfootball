<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑夜 · 灯火通明 · 球场四景</title>
<style>
/* ============================================================================
 * shell.css — 四个场景页面共用的外壳样式（玻璃质感 HUD）
 * ==========================================================================*/
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #06090f; overflow: hidden;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  color: #eaf2ff; -webkit-font-smoothing: antialiased;
  user-select: none;
}
#stage, #fx, #rays {
  position: fixed; left: 0; top: 0; display: block;
}
#fx { pointer-events: none; }
/* 体积光层（WebGL）：组件那份是叠在深色底上，这里底是明亮的照片，
   所以用 screen 把光"加"上去（白色不会糊住天空，只把被照到的天空提亮） */
#rays { pointer-events: none; mix-blend-mode: screen; z-index: 5; }

/* ---------------- HUD ---------------- */
.hud { position: fixed; z-index: 10; transition: opacity .35s ease; }
.hud.hide { opacity: 0; pointer-events: none; }

/* 左上：场景标题 */
#title {
  left: 20px; top: 18px; max-width: 46vw;
  padding: 12px 16px 13px;
  background: linear-gradient(160deg, rgba(14,20,32,.62), rgba(10,14,24,.44));
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px;
  backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 34px rgba(0,0,0,.34);
}
#title .k {
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--accent); opacity: .95; font-weight: 600;
}
#title h1 { margin: 5px 0 4px; font-size: 20px; font-weight: 650; letter-spacing: .02em; }
#title p { margin: 0; font-size: 12px; line-height: 1.55; color: rgba(226,238,255,.66); }

/* 右上：场景切换 */
#tabs {
  right: 20px; top: 18px; display: flex; gap: 6px; padding: 6px;
  background: rgba(10,14,24,.5); border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px; backdrop-filter: blur(14px) saturate(1.2);
}
#tabs a {
  display: block; padding: 8px 13px; border-radius: 9px; text-decoration: none;
  font-size: 12.5px; color: rgba(226,238,255,.72);
  border: 1px solid transparent; transition: all .18s ease; white-space: nowrap;
}
#tabs a:hover { background: rgba(255,255,255,.08); color: #fff; }
#tabs a.on {
  color: #0a0e16; font-weight: 650;
  background: var(--accent);
  box-shadow: 0 4px 16px -4px var(--accent);
}

/* 底部：控制条 */
#bar {
  left: 50%; bottom: 18px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 16px;
  padding: 11px 16px;
  background: linear-gradient(160deg, rgba(14,20,32,.66), rgba(10,14,24,.5));
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 15px;
  backdrop-filter: blur(16px) saturate(1.25);
  box-shadow: 0 14px 40px rgba(0,0,0,.4);
}
.ctl { display: flex; align-items: center; gap: 9px; }
.ctl label { font-size: 11.5px; color: rgba(226,238,255,.6); letter-spacing: .04em; white-space: nowrap; }
.ctl output { font-size: 11.5px; color: var(--accent); min-width: 34px; font-variant-numeric: tabular-nums; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 118px; height: 3px;
  background: rgba(255,255,255,.20); border-radius: 3px; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.10); cursor: grab;
}
button.btn {
  padding: 7px 13px; font-size: 12.5px; border-radius: 9px; cursor: pointer;
  color: rgba(232,242,255,.86); background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.13); transition: all .16s ease;
  font-family: inherit;
}
button.btn:hover { background: rgba(255,255,255,.14); color: #fff; }
button.btn:active { transform: translateY(1px); }
.vsep { width: 1px; height: 22px; background: rgba(255,255,255,.12); }

/* 右下：状态 */
#diag {
  right: 20px; bottom: 18px; padding: 7px 11px;
  font-size: 11px; font-variant-numeric: tabular-nums;
  color: rgba(214,230,250,.62);
  background: rgba(10,14,24,.42); border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; backdrop-filter: blur(10px);
}
#diag b { color: var(--accent); font-weight: 600; }

/* 报错条 */
#err {
  left: 50%; top: 16px; transform: translateX(-50%);
  max-width: 70vw; padding: 9px 14px; font-size: 12px; display: none;
  color: #ffd9d9; background: rgba(120,24,32,.72);
  border: 1px solid rgba(255,120,120,.35); border-radius: 10px;
  font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap;
}

/* 载入遮罩 */
#boot {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: #06090f; color: rgba(226,238,255,.7); font-size: 13px; letter-spacing: .12em;
  transition: opacity .5s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
@media (max-width: 860px) {
  #title { max-width: 60vw; }
  #title h1 { font-size: 16px; }
  #tabs a { padding: 7px 9px; font-size: 11.5px; }
  input[type=range] { width: 78px; }
  #bar { gap: 10px; padding: 9px 11px; }
}

</style>
</head>

<script>
/* ============================================================================
 * util.js — 噪声 / 云场纹理 / 画布工具
 * 无依赖，浏览器原生 Canvas 2D。所有纹理一次生成、逐帧复用。
 * ==========================================================================*/
(function (global) {
  'use strict';

  const U = {};

  /* ---------------- 数学 ---------------- */
  U.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.smoothstep = function (e0, e1, x) {

  U.approach = function (cur, target, dt, halfLife) {

    return [U.lerp(c1[0], c2[0], t), U.lerp(c1[1], c2[1], t), U.lerp(c1[2], c2[2], t)];
  };

    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  };
  function hash2(x, y, seed) {
    let n = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed | 0, 2246822519);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;

  U.hash2 = hash2;

  /* ---------------- 可平铺值噪声 + fBm ----------------
   * x 方向周期为 px（保证左右无缝，云可以无限横移），y 方向不循环。 */
  function vnoise(x, y, px, seed) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const x0 = ((xi % px) + px) % px, x1 = ((xi + 1) % px + px) % px;
    const y0 = yi, y1 = yi + 1;
    const a = hash2(x0, y0, seed), b = hash2(x1, y0, seed);
    const c = hash2(x0, y1, seed), d = hash2(x1, y1, seed);

  /**

  U.cloudGrid = function (w, h, opt) {

    const octaves = opt.octaves || 5;
    const period = opt.period || 3;      // 基础横向周期数（越大云越碎）
    const stretchY = opt.stretchY || 2.4; // 云被横向拉长
    const gain = opt.gain || 0.5;
    const lac = opt.lacunarity || 2.0;
    const warp = opt.warp === undefined ? 0.55 : opt.warp;
    const contrast = opt.contrast === undefined ? 1 : opt.contrast;
    const grid = new Float32Array(w * h);

    const ly = opt.lightY === undefined ? -0.6 : opt.lightY;

    const d = data.data;

      d[k + 2] = U.clamp(U.lerp(d[k + 2], tint[2], mixAmt) * gain, 0, 255);

        threshold: 168, gain: 2.0, tint: [255, 224, 168], tintMix: 0.42, warm: true
      });

      // 2) 楼体遮罩 → 合成"整城亮灯"的窗点（原片黄昏时楼是暗的，窗户必须生成）
      const wins = this._buildWindows(eng, raw, cityY, cityH);
      this.wins = wins;
      const city = U.makeCanvas(eng.CW, eng.CH);
      const cc = city.getContext('2d');
      cc.drawImage(wins, 0, cityY);
      cc.globalCompositeOperation = 'lighter';
      cc.drawImage(realLit, 0, cityY);
      cc.globalCompositeOperation = 'source-over';
      this.cityLights = city;
      this.cityBloom = U.blurredCopy(city, 0.2, 2);

      // 3) 灯带本体
      const lamps = U.makeCanvas(eng.CW, eng.CH);
      const lc = lamps.getContext('2d');
      A.lampBands.forEach(function (b) {
        const bx = R.x + b.x0 * R.w, by = R.y + b.y0 * R.h;
        const bw = (b.x1 - b.x0) * R.w, bh = (b.y1 - b.y0) * R.h;
        const m = U.lightMask(raw, { x: bx, y: by, w: bw, h: bh }, {
          threshold: 178, gain: 2.4, tint: [255, 246, 220], tintMix: 0.5
        });
        lc.drawImage(m, bx, by);
      });
      this.lampLights = lamps;
      this.lampBloom = U.blurredCopy(lamps, 0.16, 2);

      // 4) 复用的精灵
      this.beamSprite = U.beamSprite(256, 512, S.beam.color);
      this.poolSprite = U.glowSprite(512, 256, S.pool.color, 1.0);
      this.lampGlow = U.glowSprite(256, 128, [255, 240, 206], 0.9);

      // 5) 星空（在云之前绘制，云自然遮挡；只留在天际线以上的天空带里）
      this.stars = [];
      for (let i = 0; i < S.stars.count; i++) {
        this.stars.push({
          x: U.hash1(i, 101), y: 0.012 + U.hash1(i, 202) * 0.175,
          r: 0.5 + U.hash1(i, 303) * 1.5,
          ph: U.hash1(i, 404) * 6.28,
          sp: 0.6 + U.hash1(i, 505) * 2.2
        });
      }
      this.lampFlickerPhase = U.hash1(3, 77) * 6.28;
    },

    /* 楼体遮罩内生成窗点：一栋楼一层层亮着，越靠下越密 */
    _buildWindows: function (eng, raw, cityY, cityH) {
      const R = eng.imgRect, dpr = eng.dpr;
      const out = U.makeCanvas(eng.CW, eng.CH);
      const oc = out.getContext('2d');
      const sx = Math.max(0, Math.round(R.x)), sy = Math.max(0, Math.round(cityY));
      const sw = Math.min(raw.width - sx, Math.round(R.w));
      const sh = Math.min(raw.height - sy, Math.round(cityH));
      if (sw <= 8 || sh <= 8) return out;
      let data;
      const tmp = U.makeCanvas(sw, sh);
      const tc = tmp.getContext('2d');
      tc.drawImage(raw, sx, sy, sw, sh, 0, 0, sw, sh);
      try { data = tc.getImageData(0, 0, sw, sh).data; } catch (e) { return out; }

      const step = Math.max(2, Math.round(2.6 * dpr));
      const cellH = Math.max(2, Math.round(3.2 * dpr));
      const twinkle = [];
      let n = 0;
      for (let y = 0; y < sh - cellH; y += cellH) {
        const vNorm = y / sh;                       // 0 = 天际线附近, 1 = 楼底
        const density = 0.16 + 0.42 * vNorm;        // 近处的楼更密
        for (let x = 0; x < sw - step; x += step) {
          const k = ((y + (sy - Math.round(cityY))) * sw + x) * 4;
          const lum = 0.2126 * data[k] + 0.7152 * data[k + 1] + 0.0722 * data[k + 2];
          if (lum > 132) continue;                  // 不是楼体（天空/亮部）
          const h1 = U.hash2(x, y, 11);
          if (h1 > density) continue;
          const warm = U.hash2(x, y, 23);
          const a = 0.35 + 0.65 * U.hash2(x, y, 37);
          const col = warm > 0.72 ? [214, 226, 245] : (warm > 0.3 ? [255, 216, 150] : [255, 232, 190]);
          oc.fillStyle = U.rgb(col, a);
          const ww = Math.max(1, Math.round(step * (0.30 + 0.34 * U.hash2(x, y, 51))));
          const hh = Math.max(1, Math.round(cellH * 0.34));
          oc.fillRect(sx + x, (sy - Math.round(cityY)) + y, ww, hh);
          // 少量"会闪的窗"：整城观感靠它们活起来（避免用切片错相造成竖向接缝）
          if (twinkle.length < 160 && U.hash2(x, y, 61) > 0.86) {
            twinkle.push({
              x: sx + x, y: (sy - Math.round(cityY)) + y, w: ww, h: hh,
              col: col, a: a, ph: U.hash2(x, y, 71) * 6.28,
              sp: 0.5 + U.hash2(x, y, 83) * 2.6
            });
          }
          n++;
        }
      }
      out.__count = n;
      out.__twinkle = twinkle;
      return out;
    },

    drawSky: function (eng, ctx, t, sunVis) {
      const S = eng.S.night, R = eng.imgRect;
      const H = eng.CH;
      for (let i = 0; i < this.stars.length; i++) {
        const s = this.stars[i];
        const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
        const a = S.stars.alpha * tw * U.smoothstep(0.36, 0.0, s.y);
        if (a <= 0.01) continue;
        ctx.fillStyle = U.rgb([235, 242, 255], a);
        ctx.beginPath();
        ctx.arc(R.x + s.x * R.w, eng.py(s.y), s.r * eng.dpr, 0, 6.283);
        ctx.fill();
      }
    },

    drawWorld: function (eng, ctx, t, sunVis) {
      const S = eng.S.night, R = eng.imgRect, A = an();
      const flick = 1 - S.lampOn.flicker * (0.5 + 0.5 * Math.sin(t * 1.7 + this.lampFlickerPhase))
        * (0.6 + 0.4 * Math.sin(t * 5.3));

      // ── 城市灯：泛光 + 灯点（裁剪到城市带，省掉整屏合成）
      const cy0 = eng.py(A.cityTop) - 6, cy1 = eng.py(A.cityBot) + 8;
      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, cy0, R.w, cy1 - cy0); ctx.clip();
      setB(ctx, 'screen', S.city.alpha * 0.5 * flick);
      ctx.drawImage(this.cityBloom, 0, 0);
      setB(ctx, 'screen', S.city.alpha * (0.96 + 0.04 * Math.sin(t * 0.9)) * flick);
      ctx.drawImage(this.cityLights, 0, 0);
      // 会闪的窗：逐点亮灭，让"整城灯火"看起来是活的
      const tw = this.wins.__twinkle || [];
      for (let i = 0; i < tw.length; i++) {
        const w0 = tw[i];
        const f = 0.5 + 0.5 * Math.sin(t * w0.sp + w0.ph);
        if (f < 0.55) continue;
        ctx.fillStyle = U.rgb(w0.col, U.clamp((f - 0.55) / 0.45, 0, 1) * w0.a * 0.9);
        ctx.fillRect(w0.x, w0.y, w0.w, w0.h);
      }
      ctx.restore();
      // 城区上空的热雾：把云底照亮
      const dome = ctx.createLinearGradient(0, eng.py(0.02), 0, eng.py(0.44));
      dome.addColorStop(0, U.rgb(S.cityDome.color, 0));
      dome.addColorStop(0.62, U.rgb(S.cityDome.color, S.cityDome.alpha * 0.5));
      dome.addColorStop(1, U.rgb(S.cityDome.color, S.cityDome.alpha));
      setB(ctx, 'screen', 0.75);
      ctx.fillStyle = dome;
      ctx.fillRect(R.x, eng.py(0.02), R.w, eng.py(0.44) - eng.py(0.02));

      // ── 灯带：本体 + 泛光 + 每盏灯的球状辉光（裁剪到看台顶棚一带）
      const ly0 = eng.py(0.30), ly1 = eng.py(0.47);
      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, ly0, R.w, ly1 - ly0); ctx.clip();
      setB(ctx, 'screen', S.lampOn.glow * flick * 0.62);
      ctx.drawImage(this.lampBloom, 0, 0);
      setB(ctx, 'screen', S.lampOn.core * flick);
      ctx.drawImage(this.lampLights, 0, 0);
      ctx.restore();
      const gy = eng.py(0.398), gw = R.w * 0.15, gh = gw * 0.5;
      for (let i = 0; i < A.lampGlows.length; i++) {
        const gx = eng.px(A.lampGlows[i]);
        const a = S.lampOn.glow * flick * (0.5 + 0.45 * Math.sin(t * 3.1 + i));
        setB(ctx, 'screen', a);
        ctx.drawImage(this.lampGlow, gx - gw / 2, gy - gh / 2, gw, gh);
      }

      // ── 光锥：从灯带斜插到草坪，带缓慢摇曳
      const B = S.beam;
      const bh = R.h * B.height;
      const bw = R.w * B.width;
      for (let i = 0; i < A.beamFrom.length; i++) {
        const bx = eng.px(A.beamFrom[i]);
        const sway = B.sway * Math.sin(t * 0.55 + i * 1.7) * 0.02;
        const a = B.alpha * flick * (0.82 + 0.18 * Math.sin(t * 0.9 + i * 2.3));
        ctx.save();
        ctx.translate(bx, eng.py(0.40));
        ctx.rotate(sway + (i < 2 ? -0.10 : 0.10));
        setB(ctx, 'screen', a);
        ctx.drawImage(this.beamSprite, -bw / 2, 0, bw, bh);
        ctx.restore();
      }

      // ── 草地光池：球场灯打在草皮上的一块块亮斑
      const P = S.pool;
      for (let i = 0; i < 5; i++) {
        const u = 0.14 + i * 0.18, v = 0.18 + (i % 2) * 0.22;
        const p = eng.pitchPoint(u, v);
        const w = R.w * (0.30 + 0.06 * (i % 3)), h = w * 0.30;
        const a = P.alpha * flick * (1 - P.wobble + P.wobble * Math.sin(t * 1.3 + i * 1.9));
        setB(ctx, 'screen', a);
        ctx.drawImage(this.poolSprite, p.x - w / 2, p.y - h / 2, w, h);
      }
      // 远端底线一带的整体亮带
      const band = ctx.createLinearGradient(0, eng.py(0.60), 0, eng.py(0.86));
      band.addColorStop(0, U.rgb([255, 238, 198], 0.22 * flick));
      band.addColorStop(0.5, U.rgb([255, 240, 206], 0.10 * flick));
      band.addColorStop(1, U.rgb([255, 240, 206], 0));
      setB(ctx, 'screen', 1);
      ctx.fillStyle = band;
      ctx.fillRect(R.x, eng.py(0.60), R.w, eng.py(0.86) - eng.py(0.60));
      reset(ctx);
    }
  };

  /* ==========================================================================
   * 雨天
   * ========================================================================*/
  const SRain = {
    build: function (eng) {
      const S = eng.S.rain;
      // 雨滴：归一化的落地坐标 + 相位，全部由哈希决定 → 时间参数化
      this.parts = new Float32Array(S.count * 6);
      for (let i = 0; i < S.count; i++) {
        const k = i * 6;
        const r1 = U.hash1(i, 1), r2 = U.hash1(i, 2), r3 = U.hash1(i, 3);
        const group = i % 100;
        let layer = 0;
        if (group < S.far.share * 100) layer = 0;
        else if (group < (S.far.share + S.mid.share) * 100) layer = 1;
        else layer = 2;
        this.parts[k] = 0.06 + r1 * 0.92;          // u（横向）
        this.parts[k + 1] = Math.pow(r2, 0.75);    // v（纵深，越靠前越多）
        this.parts[k + 2] = r3;                    // 相位
        this.parts[k + 3] = 0.75 + U.hash1(i, 4) * 0.55;  // 速度抖动
        this.parts[k + 4] = layer;
        this.parts[k + 5] = U.hash1(i, 5);         // 溅落抽签
      }
      // 草地溅落候选（前 N 个满足条件的粒子）
      const cand = [];
      for (let i = 0; i < S.count && cand.length < S.splash.max * 3; i += 7) {
        if (this.parts[i * 6 + 5] > 0.34) cand.push(i);
      }
      this.splashIdx = cand.slice(0, S.splash.max);

      // 玻璃雨滴：大小不一，各自有"停留 → 滑落 → 蒸发"的周期
      this.drops = [];
      for (let i = 0; i < S.glass.count; i++) {
        const r = S.glass.minR + Math.pow(U.hash1(i, 21), 1.6) * (S.glass.maxR - S.glass.minR);
        this.drops.push({
          x: 0.05 + U.hash1(i, 22) * 0.90,
          y: 0.06 + U.hash1(i, 23) * 0.80,
          r: r,
          cycle: 7 + U.hash1(i, 24) * 9,
          phase: U.hash1(i, 25) * 20,
          sit: 1.6 + U.hash1(i, 26) * 3.4,          // 静止时长
          slide: 2.2 + U.hash1(i, 27) * 3.6,        // 滑落时长
          dist: 0.10 + U.hash1(i, 28) * 0.42,       // 滑落距离（占屏高）
          wob: U.hash1(i, 29) * 2 - 1,
          slides: U.hash1(i, 30) > 0.32              // 约七成会滑落
        });
      }

      // 雾带 / 湿草反光（与尺寸无关，绘制时拉伸）
      this.mistGrad = makeVGrad(8, 256, [
        [0, [176, 188, 202], 0], [0.45, [182, 194, 208], 1],
        [0.75, [190, 200, 214], 0.7], [1, [196, 206, 220], 0]
      ]);
      this.wetGrad = makeVGrad(8, 256, [
        [0, [200, 216, 234], 0.85], [0.35, [188, 206, 226], 0.55],
        [0.75, [180, 198, 220], 0.22], [1, [176, 194, 216], 0.05]
      ]);
    },

    drawWorld: function (eng, ctx, t, sunVis) {
      const S = eng.S.rain, R = eng.imgRect, A = an();
      const P = this.parts, N = eng.rainCount();

      // ── 雨幕后的雾带（城市与看台之间）
      setB(ctx, 'screen', S.mist.alpha);
      ctx.drawImage(this.mistGrad, R.x, eng.py(0.30), R.w, eng.py(0.62) - eng.py(0.30));

      // ── 雨丝：按层 × 3 档透明度一次性描边（性能友好）
      const layers = [S.far, S.mid, S.near];
      for (let li = 0; li < 3; li++) {
        if (li === 2) continue;                    // 最近一层放到前景画布上（更锐利）
        const L = layers[li];
        for (let b = 0; b < 3; b++) {
          const aScale = 0.6 + b * 0.35;
          setB(ctx, 'source-over', L.alpha * aScale);
          ctx.strokeStyle = U.rgb(L.color, 1);
          ctx.lineWidth = L.width * eng.dpr * (0.8 + b * 0.2);
          ctx.lineCap = 'round';
          ctx.beginPath();
          strokeLayer(ctx, eng, P, N, li, b, L.speed, L, t);
          ctx.stroke();
        }
      }
      reset(ctx);

      // ── 草坪溅落
      this._drawSplashes(eng, ctx, t);

      // ── 湿草：压暗 + 反光
      const W = S.wet;
      setB(ctx, 'multiply', 0.22);
      ctx.fillStyle = U.rgb([34, 46, 60], 1);
      ctx.fillRect(R.x, eng.py(A.pitchTop - 0.01), R.w, eng.py(1.0) - eng.py(A.pitchTop - 0.01));
      setB(ctx, 'screen', W.alpha * 0.9);
      ctx.drawImage(this.wetGrad, R.x, eng.py(A.pitchTop - 0.01), R.w, eng.py(1.0) - eng.py(A.pitchTop - 0.01));
      // 缓慢流动的水光
      const sh = ctx.createLinearGradient(R.x, 0, R.x + R.w, 0);
      const o = (t * 0.045) % 1;
      sh.addColorStop(Math.max(0, o - 0.18), U.rgb(W.color, 0));
      sh.addColorStop(o, U.rgb(W.color, W.sheen));
      sh.addColorStop(Math.min(1, o + 0.18), U.rgb(W.color, 0));
      setB(ctx, 'screen', 0.8);
      ctx.fillStyle = sh;
      ctx.fillRect(R.x, eng.py(A.pitchTop - 0.01), R.w, eng.py(1.0) - eng.py(A.pitchTop - 0.01));
      reset(ctx);

      // ── 远处极淡的闪电（乌云场景的自然点缀，强度很低）
      const fl = flash(t);
      if (fl > 0.01) {
        setB(ctx, 'screen', fl * 0.10);
        ctx.fillStyle = U.rgb([190, 206, 236], 1);
        ctx.fillRect(0, 0, eng.CW, eng.CH);
        setB(ctx, 'screen', fl * 0.09);
        ctx.drawImage(eng.glowWide, eng.px(0.62) - R.w * 0.5, eng.py(0.02) - R.h * 0.2, R.w, R.h * 0.5);
        reset(ctx);
      }
    },

    _drawSplashes: function (eng, ctx, t) {
      const S = eng.S.rain.splash;
      const RR = eng.S.rain;
      const speeds = [RR.far.speed, RR.mid.speed, RR.near.speed];
      const P = this.parts;
      const dpr = eng.dpr;
      for (let n = 0; n < this.splashIdx.length; n++) {
        const i = this.splashIdx[n];
        const k = i * 6;
        const layer = P[k + 4] | 0;
        const rate = speeds[layer] * P[k + 3];
        const cyc = (P[k + 2] + t * rate) % 1.2;
        if (cyc < 1) continue;                     // 还在空中
        const cycleDur = 1.2 / rate;
        const age = (cyc - 1) * cycleDur;
        const fr = age / S.life;
        if (fr >= 1 || fr < 0) continue;
        const g = eng.pitchPoint(P[k], P[k + 1]);
        const depth = 0.35 + 0.75 * P[k + 1];
        const R0 = (1.6 + 8 * Math.sqrt(fr)) * depth * dpr;
        const a = Math.pow(1 - fr, 1.7) * 0.75;
        ctx.save();
        setB(ctx, 'screen', a * S.ring);
        ctx.strokeStyle = U.rgb(S.color, 1);
        ctx.lineWidth = Math.max(0.6, 1.5 * depth * dpr);
        ctx.beginPath();
        ctx.ellipse(g.x, g.y, R0, R0 * 0.34, 0, 0, 6.283);
        ctx.stroke();
        if (fr < 0.45) {
          setB(ctx, 'screen', a * 0.5 * (1 - fr / 0.45));
          ctx.fillStyle = U.rgb(S.color, 1);
          ctx.beginPath();
          ctx.ellipse(g.x, g.y, R0 * 0.5, R0 * 0.2, 0, 0, 6.283);
          ctx.fill();
        }
        // 溅起的小水珠
        setB(ctx, 'screen', a * S.drops);
        ctx.fillStyle = U.rgb(S.color, 1);
        for (let q = 0; q < 3; q++) {
          const ang = (q / 3) * 6.283 + i;
          const v0 = (26 + 22 * U.hash1(i, 40 + q)) * depth * dpr;
          const hy = v0 * age - 0.5 * 320 * depth * dpr * age * age;
          if (hy < 0) continue;
          const hx = g.x + Math.cos(ang) * v0 * age * 0.45;
          ctx.beginPath();
          ctx.arc(hx, g.y - hy * 0.5, Math.max(0.5, 1.3 * depth * dpr), 0, 6.283);
          ctx.fill();
        }
        ctx.restore();
        reset(ctx);
      }
    },

    /* 前景层：近处雨丝（跟随镜头）+ 贴在"玻璃"上的雨滴（不跟随镜头） */
    drawFx: function (eng, fx, t, sunVis) {
      const S = eng.S.rain, R = eng.imgRect;
      const P = this.parts, N = eng.rainCount === undefined ? S.count : eng.rainCount;
      const L = S.near;

      for (let b = 0; b < 3; b++) {
        setB(fx, 'source-over', L.alpha * (0.55 + b * 0.4));
        fx.strokeStyle = U.rgb(L.color, 1);
        fx.lineWidth = L.width * eng.dpr * (0.8 + b * 0.25);
        fx.lineCap = 'round';
        fx.beginPath();
        strokeLayer(fx, eng, P, N, 2, b, L.speed, L, t);
        fx.stroke();
      }
      reset(fx);

      // 之后的一切都贴在镜头上，用屏幕坐标
      fx.setTransform(1, 0, 0, 1, 0, 0);
      fx.globalCompositeOperation = 'source-over';
      this._drawGlass(eng, fx, t, sunVis);
      reset(fx);
    },

    _drawGlass: function (eng, fx, t, sunVis) {
      const S = eng.S.rain.glass;
      const CW = eng.CW, CH = eng.CH, stage = eng.stage;
      const scale = CH / 900;
      const ga = eng.glassAmount === undefined ? 1 : eng.glassAmount;
      if (ga <= 0.01) return;
      for (let i = 0; i < this.drops.length; i++) {
        const d = this.drops[i];
        if (!d.slides && (i % 3 !== 0)) continue;          // 关闭部分"只挂不落"的雨滴
        const cyc = ((t * S.slide + d.phase) % d.cycle + d.cycle) % d.cycle;
        const r = Math.max(3, d.r * scale);
        const popIn = U.smoothstep(0, 0.18, cyc);
        const dead = cyc > d.sit + d.slide;
        const life = d.cycle - (d.sit + d.slide);
        const fade = dead ? U.clamp(1 - (cyc - d.sit - d.slide) / Math.max(0.4, life * 0.55), 0, 1) : 1;
        if (fade <= 0.01) continue;

        let prog = 0, sliding = false;
        if (cyc > d.sit && d.slides) {
          const sp = U.clamp((cyc - d.sit) / d.slide, 0, 1);
          prog = sp * sp * (3 - 2 * sp) * d.dist;
          sliding = sp < 1;
        }
        const x = d.x * CW + Math.sin(t * 0.5 + i) * 0.6 * scale;
        const y = (d.y + prog) * CH;
        const rNow = r * (0.55 + 0.45 * popIn);
        const alpha = fade * popIn * ga;

        // 滑落痕迹：一道湿痕 + 沿途残留的细小水珠（竖向拉长，不是小圆圈）
        if (prog > 0.004 && S.trail > 0) {
          const yTop = d.y * CH;
          const g = fx.createLinearGradient(0, yTop, 0, y);
          g.addColorStop(0, 'rgba(226,238,250,0)');

    this.ctx = this.canvas.getContext('2d');
    this.fxCtx = this.fxCanvas ? this.fxCanvas.getContext('2d') : null;
    // 体积光层（WebGL，移植自用户给的 LightRays 组件）；不支持 WebGL 时退回 canvas2d 的 _drawRays
    this.raysGL = (global.SRays && this.cfg.raysCanvas && !this.cfg.raysOff && this.S.raysGL)
      ? global.SRays.create(this.cfg.raysCanvas, this.S.raysGL) : null;

    this.W = 800; this.H = 600; this.dpr = 1;
    this.CW = 0; this.CH = 0;
    this.imgRect = { x: 0, y: 0, w: 800, h: 600 };

    this.t = 0;
    this.paused = false;
    this.cloudSpeed = 1;
    this.rainAmount = 1;
    this.glassAmount = 1;
    this.speedScale = 1;
    this.stats = { fps: 0, ms: 0, frames: 0 };
    this.errors = [];
    this.time = 0;

    this.mouse = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, active: false };
    this.state = { sunVis: 1, occ: 0, cloudOff1: 0, cloudOff2: 0, cloudOffS: 0 };

    this._buildTextures();
    this.resize();
    this._bind();
  }

  Engine.prototype.px = function (nx) { return this.imgRect.x + nx * this.imgRect.w; };
  Engine.prototype.py = function (ny) { return this.imgRect.y + ny * this.imgRect.h; };

  /* ---------------- 纹理（只生成一次，与画布尺寸无关） ---------------- */
  Engine.prototype._buildTextures = function () {
    const S = this.S;
    const CW = 1024, CHh = 256;

    // 实拍云层模式、或云全关（alpha 都是 0）时都不需要程序化云精灵，省掉这部分构建开销
    const cloudsOn = (S.cloud.alpha1 > 0) || (S.cloud.alpha2 > 0);
    if (cloudsOn && !(S.cloud.photo && this.cloudTile)) {
      this.grid1 = U.cloudGrid(CW, CHh, S.cloud.layer1);
      this.cloud1 = U.cloudSprite(CW, CHh, this.grid1, S.cloud.sprite1);
      this.grid2 = U.cloudGrid(CW, CHh, S.cloud.layer2);
      this.cloud2 = U.cloudSprite(CW, CHh, this.grid2, S.cloud.sprite2);
    }

    // 云的投影：低频大块 + 透视梯形 + 竖向渐变 → 一次性上色
    // 实拍云层模式下，网格直接从云层贴图的 alpha 降采样得到 → 云影形状和天上的云一致
    const photo = S.cloud.photo;
    const GW = 512, GH = photo ? 80 : 256;
    if (photo && this.cloudTile) {
      this.shadowGrid = U.gridFromAlpha(this.cloudTile, GW, GH, { gamma: photo.gamma });
    } else {
      this.shadowGrid = U.cloudGrid(GW, GH, S.cloud.shadow);
    }
    this.shadowW = GW; this.shadowH = GH;
    const mask = U.gridToMask(GW, GH, this.shadowGrid,
      photo ? { lo: photo.shadowLo === undefined ? 0.10 : photo.shadowLo, hi: 0.62, gamma: 1.1 } : S.cloud.shadowMask);
    const cs = S.cloud.shadowScene;
    const warped = trapezoid(mask, 1.30, [
      [0.00, 0], [0.16, S.cloud.shadowNear], [0.72, 1], [1.00, 0.5]
    ]);
    const wc = warped.getContext('2d');
    wc.globalCompositeOperation = 'source-in';
    wc.fillStyle = U.rgb(cs.color, 1);
    wc.fillRect(0, 0, warped.width, warped.height);
    wc.globalCompositeOperation = 'source-over';
    // 柔化：原版梯形遮罩边缘偏硬、上草皮后会显斑驳，这里整体模糊一遍
    this.shadowSprite = U.blurredCopy(warped, 0.34, 2);

    this.glowWarm = U.glowSprite(512, 512, S.sun.glowColor, 1.0);
    this.glowWide = U.glowSprite(512, 256, S.sun.wideColor || S.sun.glowColor, 1.35);
    this.grain = U.grainSprite(256, 1);
    this.shafts = this._buildShafts();
    this.vignette = null;
  };

  /* 草皮上被云影切开的斜向光带 */
  Engine.prototype._buildShafts = function () {
    const w = 768, h = 512;
    const cv = U.makeCanvas(w, h);
    const c = cv.getContext('2d');
    const col = this.S.shaft.color;
    for (let i = 0; i < 5; i++) {
      const x = w * (0.08 + i * 0.21) + (i % 2 ? 30 : -18);
      const bw = w * (0.075 + (i % 3) * 0.028);
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, U.rgb(col, 0));
      g.addColorStop(0.35, U.rgb(col, this.S.shaft.alpha * (0.7 + (i % 3) * 0.15)));
      g.addColorStop(1, U.rgb(col, 0));
      c.save();
      c.translate(x, 0);
      c.rotate(this.S.shaft.angle);
      c.fillStyle = g;
      c.filter = 'blur(10px)';
      c.fillRect(-bw / 2, 0, bw, h);
      c.restore();
    }
    c.filter = 'none';
    c.globalCompositeOperation = 'destination-in';
    const g2 = c.createLinearGradient(0, 0, 0, h);
    g2.addColorStop(0, 'rgba(255,255,255,0)');
    g2.addColorStop(0.22, 'rgba(255,255,255,1)');
    g2.addColorStop(0.72, 'rgba(255,255,255,0.9)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g2; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'source-over';
    return cv;
  };

  /* ---------------- 尺寸 / 底板 ---------------- */
  Engine.prototype.resize = function () {
    const w = Math.max(320, global.innerWidth || 1280);
    const h = Math.max(240, global.innerHeight || 720);
    let dpr = Math.min(global.devicePixelRatio || 1, 1.5);
    const maxPix = 2.9e6;
    if (w * h * dpr * dpr > maxPix) dpr = Math.sqrt(maxPix / (w * h));
    dpr = Math.max(0.6, Math.min(dpr, 1.5));

    this.W = w; this.H = h; this.dpr = dpr;
    const CW = Math.round(w * dpr), CH = Math.round(h * dpr);
    if (CW === this.CW && CH === this.CH && this.base) return;
    this.CW = CW; this.CH = CH;

    [this.canvas, this.fxCanvas].forEach(function (cv) {
      if (!cv) return;
      cv.width = CW; cv.height = CH;
      cv.style.width = w + 'px';
      cv.style.height = h + 'px';
    });
    if (this.raysGL) {
      const rcv = this.cfg.raysCanvas;
      rcv.style.width = w + 'px'; rcv.style.height = h + 'px';
      this.raysGL.resize(w, h, dpr);
    }

    // cover 贴合：偏向上缘，裁掉的是画面下缘（保住天空与城市）
    const ar = this.img.width / this.img.height;
    const car = CW / CH;
    let iw, ih, ix, iy;
    if (car > ar) { iw = CW; ih = CW / ar; ix = 0; iy = Math.min(0, (CH - ih) * 0.30); }
    else { ih = CH; iw = CH * ar; ix = (CW - iw) / 2; iy = 0; }
    this.imgRect = { x: ix, y: iy, w: iw, h: ih };

    this.stage = U.makeCanvas(CW, CH);
    this.stageCtx = this.stage.getContext('2d');
    this._buildBase();
    this._buildVignette();
    if (global.SNight && this.S.night) global.SNight.build(this);
    if (global.SRain && this.S.rain) global.SRain.build(this);
  };

  Engine.prototype._buildBase = function () {
    const S = this.S, CW = this.CW, CH = this.CH, R = this.imgRect;
    const cv = U.makeCanvas(CW, CH);
    const c = cv.getContext('2d');
    c.fillStyle = S.base.backdrop || '#0a0f18';
    c.fillRect(0, 0, CW, CH);
    if ('filter' in c && S.base.filter) c.filter = S.base.filter;
    c.drawImage(this.img, R.x, R.y, R.w, R.h);
    c.filter = 'none';

    (S.base.overlays || []).forEach(function (ov) {
      setB(c, ov.blend, ov.alpha);
      if (ov.grad) {
        const g = c.createLinearGradient(0, CH * (ov.grad.y0 || 0), 0, CH * (ov.grad.y1 === undefined ? 1 : ov.grad.y1));
        ov.grad.stops.forEach(function (st) { g.addColorStop(st[0], U.rgb(st[1], st[2])); });
        c.fillStyle = g;
      } else { c.fillStyle = U.rgb(ov.color, 1); }
      if (ov.rect) c.fillRect(CW * ov.rect[0], CH * ov.rect[1], CW * ov.rect[2], CH * ov.rect[3]);
      else c.fillRect(0, 0, CW, CH);
    });
    resetCtx(c);

    // 白天/黄昏/雨天：球场灯是关着的 —— 把灯带压暗
    if (S.lampsOff) {
      setB(c, 'multiply', S.lampsOff.alpha);
      this.A.lampBands.forEach(function (b) {
        const x = R.x + b.x0 * R.w, y = R.y + b.y0 * R.h;
        const w = (b.x1 - b.x0) * R.w, h = (b.y1 - b.y0) * R.h;
        const g = c.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, U.rgb(S.lampsOff.color, 0.10));
        g.addColorStop(0.5, U.rgb(S.lampsOff.color, 1));
        g.addColorStop(1, U.rgb(S.lampsOff.color, 0.10));
        c.fillStyle = g;
        c.fillRect(x, y, w, h);
      });
      resetCtx(c);
    }
    this.base = cv;
  };

  Engine.prototype._buildVignette = function () {
    const CW = this.CW, CH = this.CH;
    const cv = U.makeCanvas(CW, CH);
    const c = cv.getContext('2d');
    const g = c.createRadialGradient(CW * 0.5, CH * 0.46, Math.min(CW, CH) * 0.30,
      CW * 0.5, CH * 0.5, Math.max(CW, CH) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.62, 'rgba(0,0,0,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    c.fillStyle = g; c.fillRect(0, 0, CW, CH);
    this.vignette = cv;
  };

  /* ---------------- 输入 ---------------- */
  Engine.prototype._bind = function () {
    const self = this;
    this._onResize = function () { self.resize(); };
    global.addEventListener('resize', this._onResize);
    this._onMove = function (e) {
      const p = e.touches ? e.touches[0] : e;
      self.mouse.x = U.clamp(p.clientX / self.W, 0, 1);
      self.mouse.y = U.clamp(p.clientY / self.H, 0, 1);
      self.mouse.active = true;
    };
    global.addEventListener('mousemove', this._onMove, { passive: true });
    global.addEventListener('touchmove', this._onMove, { passive: true });
  };

  /* ---------------- 云遮日：采样云影密度 ---------------- */
  Engine.prototype._sampleOcclusion = function (off) {
    const GW = this.shadowW, GH = this.shadowH, g = this.shadowGrid;
    // 云全关（alpha1/alpha2 都是 0，例如"云静止不动"的白天场景）：永远不遮挡 → sunVis 恒为 1
    if (!(this.S.cloud.alpha1 > 0) && !(this.S.cloud.alpha2 > 0)) return 0;
    // 实拍云层：直接按"太阳所在的那一列"取（太阳在画面外右上，光就是从那来的）
    const sunCol = this.S.cloud.photo ? this.S.sun.x : (this.S.sun.x * 0.35 + 0.06);
    const sx = ((sunCol * GW - off) % GW + GW) % GW;
    let sum = 0, cnt = 0, mx = 0;
    const rows = this.S.cloud.photo ? [0.06, 0.26, 0.50, 0.78] : [0.12, 0.23, 0.34, 0.45, 0.56];
    const span = this.S.cloud.photo ? 8 : 1;
    const step = this.S.cloud.photo ? 0.025 : 0.05;
    for (let r = 0; r < rows.length; r++) {
      const yy = Math.min(GH - 1, Math.round(GH * rows[r]));
      for (let d = -span; d <= span; d++) {
        const xx = ((Math.round(sx + d * GW * step) % GW) + GW) % GW;
        sum += g[yy * GW + xx];
        if (g[yy * GW + xx] > mx) mx = g[yy * GW + xx];
        cnt++;
      }
    }
    const om = this.S.cloud.occMap || [0.34, 0.76];
    // 实拍云层：稀疏的云要靠"窗口内最大值"来判断太阳有没有被挡住，只取均值会长期贴着 0
    const v = this.S.cloud.photo ? (mx * 0.65 + (sum / cnt) * 0.35) : (sum / cnt);
    return U.clamp((v - om[0]) / (om[1] - om[0]), 0, 1);
  };

  Engine.prototype.rainCount = function () {
    if (!this.S.rain) return 0;
    return Math.round(this.S.rain.count * U.clamp(this.rainAmount, 0, 1.4));
  };

  /* ---------------- 单帧 ---------------- */
  Engine.prototype.render = function (t, dt) {
    const S = this.S, ctx = this.stageCtx;
    this.t = t;

    this.mouse.sx = U.approach(this.mouse.sx, this.mouse.x, dt, 0.35);
    this.mouse.sy = U.approach(this.mouse.sy, this.mouse.y, dt, 0.35);
    const mx = (this.mouse.sx - 0.5), my = (this.mouse.sy - 0.5);

    const spd = this.cloudSpeed;
    const off1 = ((t * S.cloud.speed1 * spd) % 1) * 1024;
    const off2 = ((t * S.cloud.speed2 * spd) % 1) * 1024;
    const offS = ((t * S.cloud.speedShadow * spd) % 1) * this.shadowW;
    this.state.cloudOff1 = off1; this.state.cloudOff2 = off2; this.state.cloudOffS = offS;

    const occ = this._sampleOcclusion(offS);
    this.state.occ = occ;
    this.state.sunVis = U.approach(this.state.sunVis, 1 - occ, dt, 0.55);
    const sunVis = this.state.sunVis;

    resetCtx(ctx);
    ctx.save();
    const MB = S.mouse || {};
    const camS = MB.camS === undefined ? 1.024 : MB.camS;
    const camX = -mx * (MB.cam === undefined ? 17 : MB.cam) * this.dpr;
    const camY = -my * (MB.camY === undefined ? 10 : MB.camY) * this.dpr;
    ctx.translate(this.CW / 2, this.CH / 2);
    ctx.scale(camS, camS);
    ctx.translate(-this.CW / 2 + camX, -this.CH / 2 + camY);

    ctx.drawImage(this.base, 0, 0);

    this._drawSkyPaint(ctx, mx, my);
    if (global.SNight && S.night) global.SNight.drawSky(this, ctx, t, sunVis);
    this._drawSun(ctx, mx, my, sunVis, true);          // 光源本体（会被云遮住）
    this._drawClouds(ctx, off1, off2, mx, my, sunVis); // 云在光源之上
    this._drawSun(ctx, mx, my, sunVis, false);         // 云后的透光 + 被遮时的压暗
    this._drawGroundShadow(ctx, offS, sunVis);
    if (S.shaft) this._drawShafts(ctx, t, mx, sunVis);
    if (!this.raysGL) this._drawRays(ctx, mx, my, sunVis);   // 天空里成扇的日光（WebGL 不可用时的 2D 兜底）
    this._drawSunPatch(ctx, mx, my, sunVis);  // 落在草皮上的阳光斑（随鼠标平移）

    if (global.SNight && S.night) global.SNight.drawWorld(this, ctx, t, sunVis);
    if (global.SRain && S.rain) global.SRain.drawWorld(this, ctx, t, sunVis);

    this._drawExposure(ctx, sunVis, my);
    this._drawFix(ctx, t);

    ctx.restore();

    // ---- 前景（雨丝 / 玻璃雨滴）：只有雨天用它，其余场景连清屏都省掉 ----
    const fx = this.fxCtx;
    const hasFx = !!(global.SRain && S.rain);
    if (fx && hasFx) {
      resetCtx(fx);
      fx.clearRect(0, 0, this.CW, this.CH);
      fx.save();
      fx.translate(this.CW / 2, this.CH / 2);
      fx.scale(camS, camS);
      fx.translate(-this.CW / 2 + camX, -this.CH / 2 + camY);
      global.SRain.drawFx(this, fx, t, sunVis);
      fx.restore();
      resetCtx(fx);
    }

    // 体积光层：WebGL 渲染到独立画布，由 CSS mix-blend-mode: screen 叠加显示
    if (this.raysGL) {
      try { this.raysGL.render(t, this.mouse.sx, this.mouse.sy); }
      catch (e) { this.raysGL = null; }
    }

    const c2 = this.ctx;    resetCtx(c2);
    c2.drawImage(this.stage, 0, 0);
  };

  /* ---------------- 天空换色 ---------------- */
  Engine.prototype._drawSkyPaint = function (ctx, mx, my) {
    const S = this.S, R = this.imgRect, A = this.A;
    if (!S.skyPaint) return;
    const y0 = this.py(0), y1 = this.py(A.skyPaintBot);
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    S.skyPaint.stops.forEach(function (s) { g.addColorStop(s[0], U.rgb(s[1], s[2])); });
    setB(ctx, S.skyPaint.blend, S.skyPaint.alpha);
    ctx.save();
    ctx.translate(-mx * 6 * this.dpr, -my * 3 * this.dpr);
    ctx.fillStyle = g;
    ctx.fillRect(R.x - 60, y0 - 60, R.w + 120, (y1 - y0) + 120);
    ctx.restore();
    resetCtx(ctx);
  };

  /* ---------------- 云（两层，各自平铺横移） ---------------- */
  Engine.prototype._drawClouds = function (ctx, off1, off2, mx, my, sunVis) {
    const S = this.S, R = this.imgRect, A = this.A;
    // 云全关（alpha 都是 0）：不画云，也不做云后透光——画面里的云只来自底板本身
    if (!(S.cloud.alpha1 > 0) && !(S.cloud.alpha2 > 0)) return;
    const photo = S.cloud.photo;
    if (photo && this.cloudTile) {
      this._drawPhotoClouds(ctx, off1, off2, mx, my, sunVis);
      return;
    }
    const y0 = this.py(A.skyTop), hgt = (A.skyBot - A.skyTop) * R.h;
    const w = R.w;
    const layers = [
      { spr: this.cloud2, off: off2, alpha: S.cloud.alpha2 * (0.62 + 0.38 * sunVis), par: 0.45, sc: 1.06, y: 0.02 },
      { spr: this.cloud1, off: off1, alpha: S.cloud.alpha1 * (0.55 + 0.45 * sunVis), par: 1.0, sc: 1.0, y: 0.0 }
    ];
    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      const px = -((L.off % 1024) / 1024) * w + R.x - mx * 14 * L.par * this.dpr;
      const py = y0 + L.y * hgt - my * 5 * L.par * this.dpr;
      const ph = hgt * L.sc;
      // 精灵下部（纵向淡出之后）本来就是空的，只画有内容的上段：省掉约四成填充面积
      const crop = 0.62;
      setB(ctx, 'source-over', L.alpha);
      ctx.drawImage(L.spr, 0, 0, L.spr.width, L.spr.height * crop, px, py, w, ph * crop);
      ctx.drawImage(L.spr, 0, 0, L.spr.width, L.spr.height * crop, px + w, py, w, ph * crop);
      if (px > R.x) ctx.drawImage(L.spr, 0, 0, L.spr.width, L.spr.height * crop, px - w, py, w, ph * crop);
    }
    resetCtx(ctx);
  };

  /**
   * 实拍云层：把从照片里抠出来的云贴图横向平铺、按不同速度漂移。
   * 第二层用镜像 + 放大，避免和第一层"同一朵云出现两次"的重复感。
   */
  Engine.prototype._drawPhotoClouds = function (ctx, off1, off2, mx, my, sunVis) {
    const S = this.S, R = this.imgRect, tp = S.cloud.photo;
    const band = tp.band || 0.235;
    const layers = [
      { off: off2, sc: tp.scale2 || 1.45, alpha: tp.alpha2, dy: tp.dy2 || 0.004, par: 0.45, mirror: true },
      { off: off1, sc: tp.scale1 || 1.00, alpha: tp.alpha1, dy: 0, par: 1.0, mirror: false }
    ];
    const x0 = R.x - 40, x1 = R.x + R.w + 40;
    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      const bw = R.w * L.sc;
      const bh = R.h * band * L.sc;
      const py = R.y + L.dy * R.h - my * 5 * L.par * this.dpr;
      const phase = ((L.off % 1024) / 1024) * bw;
      let px = x0 - phase - mx * 14 * L.par * this.dpr;
      px = x0 - ((phase + mx * 14 * L.par * this.dpr) % bw);
      setB(ctx, 'source-over', L.alpha);
      const i0 = Math.floor((x0 - px) / bw), i1 = Math.ceil((x1 - px) / bw);
      for (let i = i0; i <= i1; i++) {
        const x = px + i * bw;
        // 镜像平铺：相邻两块互为镜像 → 边界天然连续，没有硬接缝
        const flip = (L.mirror ? 1 : 0) !== (((i % 2) + 2) % 2);
        if (flip) {
          ctx.save();
          ctx.translate(x + bw, py);
          ctx.scale(-1, 1);
          ctx.drawImage(this.cloudTile, 0, 0, bw, bh);
          ctx.restore();
        } else {
          ctx.drawImage(this.cloudTile, x, py, bw, bh);
        }
      }
    }
    resetCtx(ctx);
  };

  /* ---------------- 云的投影扫过草皮 ---------------- */
  Engine.prototype._drawGroundShadow = function (ctx, offS, sunVis) {
    const S = this.S, R = this.imgRect, A = this.A;
    const cs = S.cloud.shadowScene;
    if (!cs || !this.shadowSprite || !(cs.alpha > 0)) return;
    const y0 = this.py(A.pitchTop - 0.03);
    const hgt = this.py(1.0) - y0 + 12;
    const sw = this.shadowSprite.width / this.shadowW;   // 梯形加宽系数
    const w = R.w * sw;
    const px = -((offS % this.shadowW) / this.shadowW) * R.w + R.x - (w - R.w) / 2;
    setB(ctx, 'multiply', cs.alpha * (0.5 + 0.5 * sunVis));
    ctx.drawImage(this.shadowSprite, px, y0, w, hgt);
    ctx.drawImage(this.shadowSprite, px + R.w, y0, w, hgt);
    if (px > R.x - R.w) ctx.drawImage(this.shadowSprite, px - R.w, y0, w, hgt);
    resetCtx(ctx);
  };

  /* ---------------- 太阳 / 光源 ---------------- */
  Engine.prototype._drawSun = function (ctx, mx, my, sunVis, pre) {
    const S = this.S, R = this.imgRect;
    const MB = S.mouse || {};
    const cx = this.px(S.sun.x) + mx * this.dpr * (MB.sun === undefined ? 58 : MB.sun) + (1 - sunVis) * 8;
    const cy = this.py(S.sun.y) + my * this.dpr * (MB.sunY === undefined ? 30 : MB.sunY);
    const tweak = 1 + my * (MB.glow === undefined ? 0.12 : MB.glow);   // 鼠标上下：光的强弱轻微起伏
    if (pre) {
      const sz = R.w * S.sun.size;
      setB(ctx, 'screen', S.sun.strength * (0.35 + 0.65 * sunVis) * tweak);
      ctx.drawImage(this.glowWide, cx - sz * 1.5, cy - sz * 0.75, sz * 3, sz * 1.5);
      setB(ctx, 'screen', S.sun.core * (0.4 + 0.6 * sunVis) * tweak);
      ctx.drawImage(this.glowWarm, cx - sz * 0.5, cy - sz * 0.5, sz, sz);
    } else {
      // 云缝里透出来的那一小团光
      const sz2 = R.w * S.sun.size * 0.34;
      setB(ctx, 'screen', S.sun.core * 0.5 * (0.25 + 0.75 * sunVis));
      ctx.drawImage(this.glowWarm, cx - sz2 * 0.5, cy - sz2 * 0.5, sz2, sz2);
      if (sunVis < 0.92) {
        setB(ctx, 'multiply', (0.92 - sunVis) * (S.sun.shadeStrength || 1.0));
        ctx.fillStyle = U.rgb(S.sun.shadeColor || [120, 138, 168], 1);
        ctx.fillRect(0, 0, this.CW, this.CH);
      }
    }
    resetCtx(ctx);
  };

  /* ---------------- 草皮上的斜向光带 ---------------- */
  Engine.prototype._drawShafts = function (ctx, t, mx, sunVis) {
    const S = this.S, R = this.imgRect, A = this.A;
    const y0 = this.py(A.pitchTop - 0.06);
    const hgt = this.py(1.0) - y0 + 20;
    const w = R.w * 1.12;
    const MB = S.mouse || {};
    const swayK = S.shaft.sway === undefined ? 1 : S.shaft.sway;
    const sway = Math.sin(t * 0.11) * 0.012 * swayK;
    setB(ctx, 'screen', S.shaft.sceneAlpha * (0.10 + 0.90 * sunVis));
    ctx.save();
    ctx.translate(R.x - (w - R.w) / 2 + mx * this.dpr * (MB.shaft === undefined ? 18 : MB.shaft) + sway * R.w, y0 + (1 - sunVis) * 6);
    ctx.drawImage(this.shafts, 0, 0, w, hgt);
    ctx.restore();
    resetCtx(ctx);
  };

  /* ---------------- 天空里成扇的日光（随鼠标轻转，只在天空带内） ---------------- */
  Engine.prototype._drawRays = function (ctx, mx, my, sunVis) {
    const S = this.S, cfg = S.rays;
    if (!cfg || !(cfg.alpha > 0)) return;
    const R = this.imgRect;
    const ox = this.px(cfg.x === undefined ? S.sun.x : cfg.x) + mx * this.dpr * (cfg.mx || 0);
    const oy = this.py(cfg.y === undefined ? S.sun.y : cfg.y) + my * this.dpr * (cfg.my || 0);
    const N = cfg.count || 7, w = cfg.wide || 0.045, sp = cfg.spread || 0.16;
    const len = this.CH * (cfg.len || 0.45);
    const rot = mx * (cfg.rot || 0);   // mx 已是以画面中心为 0 的偏移
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, this.CW, this.py(cfg.clip === undefined ? 0.44 : cfg.clip));
    ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = cfg.alpha * (0.35 + 0.65 * sunVis);
    for (let i = 0; i < N; i++) {
      const a = Math.PI / 2 + (i - (N - 1) / 2) * sp + rot;
      const g = ctx.createLinearGradient(ox, oy, ox + Math.cos(a) * len, oy + Math.sin(a) * len);
      g.addColorStop(0, U.rgb(cfg.color, 0.95));
      g.addColorStop(0.35, U.rgb(cfg.color, 0.42));
      g.addColorStop(1, U.rgb(cfg.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(a - w) * len, oy + Math.sin(a - w) * len);
      ctx.lineTo(ox + Math.cos(a + w) * len, oy + Math.sin(a + w) * len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    resetCtx(ctx);
  };

  /* ---------------- 草坪上的光带与影子（鼠标移动光源 → 光与影实时联动） ----------------
     做法：在草皮矩形内画一对互补的平行渐变带 —— 用 screen 加亮"受光侧"、用 multiply 压暗"背光侧"，
     两条带共用同一条渐变轴与同一组分界 stop，所以明暗交界永远吻合，鼠标一动整条光影边界就跟着平移。 */
  Engine.prototype._drawSunPatch = function (ctx, mx, my, sunVis) {
    const S = this.S, cfg = S.sunPatch;
    if (!cfg || !(cfg.alpha > 0 || cfg.shadow > 0)) return;
    const R = this.imgRect, A = this.A;
    const y0 = this.py(A.pitchTop), y1 = this.py(A.pitchBot);
    if (!(y1 > y0)) return;

    const shift = mx * (cfg.mx || 0) * R.w;                  // 鼠标左右 → 光/影边界整体平移
    const rise = my * (cfg.my || 0) * R.h;                   // 鼠标上下 → 边界轻微上下浮动
    const th = cfg.angle === undefined ? 0.60 : cfg.angle;   // 明暗边界的方向（与光的方向一致：左上→右下）
    const ax = Math.sin(th), ay = -Math.cos(th);             // 垂直于边界：从受光侧指向背光侧
    const cx = this.px(cfg.x) + shift;
    const cy = (y0 + y1) * 0.5 + rise;
    const L = R.w * (cfg.len === undefined ? 0.80 : cfg.len);
    const gx0 = cx - ax * L, gy0 = cy - ay * L, gx1 = cx + ax * L, gy1 = cy + ay * L;
    const mid = cfg.mid === undefined ? 0.50 : cfg.mid;      // 分界在渐变轴上的位置
    const soft = cfg.soft === undefined ? 0.16 : cfg.soft;   // 过渡带宽度
    const lit = cfg.color || [255, 246, 222];

    ctx.save();
    ctx.beginPath();
    ctx.rect(R.x, y0, R.w, y1 - y0);
    ctx.clip();

    // ① 影子：背光侧 multiply 压暗（白 = 不动，暗色 = 压暗）
    if (cfg.shadow > 0) {
      const g = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(Math.max(0, mid - soft), 'rgba(255,255,255,1)');
      g.addColorStop(Math.min(1, mid + soft), 'rgba(54,68,94,1)');
      g.addColorStop(1, 'rgba(44,58,84,1)');
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = cfg.shadow * (0.55 + 0.45 * sunVis);
      ctx.fillStyle = g;
      ctx.fillRect(R.x, y0, R.w, y1 - y0);
    }

    // ② 阳光：受光侧 screen 加亮（黑 = 不动，暖白 = 加光）
    if (cfg.alpha > 0) {
      const g2 = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
      g2.addColorStop(0, 'rgba(' + lit[0] + ',' + lit[1] + ',' + lit[2] + ',1)');
      g2.addColorStop(Math.max(0, mid - soft), 'rgba(' + lit[0] + ',' + lit[1] + ',' + lit[2] + ',1)');
      g2.addColorStop(Math.min(1, mid + soft), 'rgba(0,0,0,1)');
      g2.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = cfg.alpha * (0.45 + 0.55 * sunVis) * (1 + my * 0.18);
      ctx.fillStyle = g2;
      ctx.fillRect(R.x, y0, R.w, y1 - y0);
    }

    ctx.restore();
    resetCtx(ctx);
  };

  /* ---------------- 曝光（云遮日的整体明暗） ---------------- */
  Engine.prototype._drawExposure = function (ctx, sunVis, my) {
    const ex = this.S.exposure, MB = this.S.mouse || {};
    if (!(ex.darken > 0) && !(ex.lift > 0)) return;   // 不改变亮度：整段跳过
    const mt = (my || 0) * (MB.exposure === undefined ? 1 : MB.exposure);   // 鼠标上下：整体曝光轻微起伏
    const dark = (1 - sunVis) * ex.darken * (1 - mt * 0.55);
    if (dark > 0.002) {
      setB(ctx, 'multiply', dark);
      const g = ctx.createLinearGradient(0, 0, 0, this.CH);
      g.addColorStop(0, U.rgb(ex.darkTop, 1));
      g.addColorStop(0.55, U.rgb(ex.darkMid, 1));
      g.addColorStop(1, U.rgb(ex.darkBot, 1));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.CW, this.CH);
    }
    const lift = (sunVis - 0.72) * ex.lift + mt * 0.14;
    if (lift > 0.002) {
      setB(ctx, 'screen', Math.min(lift, 0.20));
      ctx.fillStyle = U.rgb(ex.liftColor, 1);
      ctx.fillRect(0, 0, this.CW, this.CH);
    }
    resetCtx(ctx);
  };

  /* ---------------- 暗角 + 颗粒 ---------------- */
  Engine.prototype._drawFix = function (ctx, t) {
    const S = this.S;
    if (this.fxOff) return;          // ?fx=0：跳过暗角与颗粒
    if (this.vignette) {
      setB(ctx, 'source-over', S.vignette);
      ctx.drawImage(this.vignette, 0, 0);
    }
    if (S.grain > 0 && this.grain) {
      setB(ctx, 'overlay', S.grain);
      const off = (Math.floor(t * 12) * 97) % 256;
      if (!this._grainPat) this._grainPat = ctx.createPattern(this.grain, 'repeat');
      if (this._grainPat) {
        // 一次填充代替四次整屏平铺：overlay 合成成本与覆盖面积成正比
        ctx.save();
        ctx.translate(-off, -off);
        ctx.fillStyle = this._grainPat;
        ctx.fillRect(0, 0, this.CW + 256, this.CH + 256);
        ctx.restore();
      } else {
        ctx.drawImage(this.grain, -off, -off);
        ctx.drawImage(this.grain, -off + 256, -off);
        ctx.drawImage(this.grain, -off, -off + 256);
        ctx.drawImage(this.grain, -off + 256, -off + 256);
      }
    }
    resetCtx(ctx);
  };

  /* ---------------- 主循环 ---------------- */
  Engine.prototype.start = function () {
    const self = this;
    const fixed = this.cfg.fixedTime;
    let last = performance.now();
    let acc = 0, accN = 0;
    function frame(now) {
      const real = (now - last) / 1000;
      last = now;
      const dt = Math.min(0.05, Math.max(0.0005, real));
      if (!self.paused && fixed === undefined) self.time += dt;
      const t = fixed !== undefined ? fixed : self.time;
      const t0 = performance.now();
      try {
        self.render(t, dt);
      } catch (e) {
        self.errors.push(String((e && e.stack) || e));
        if (global.__onEngineError) global.__onEngineError(e);
        throw e;
      }
      const ms = performance.now() - t0;
      acc += ms; accN++;
      if (accN >= 20) { self.stats.ms = acc / accN; self.stats.fps = 1000 / Math.max(0.01, acc / accN); acc = 0; accN = 0; }
      self.stats.frames++;
      if (fixed === undefined) global.requestAnimationFrame(frame);
    }
    global.requestAnimationFrame(frame);
    return this;
  };

  /** 定格渲染一帧（截图 / 自检用） */
  Engine.prototype.renderAt = function (t) {
    this.time = t;
    this.state.sunVis = 1 - this._sampleOcclusion(((t * this.S.cloud.speedShadow * this.cloudSpeed) % 1) * this.shadowW);
    this.render(t, 0.016);
    return this;
  };

  /** 世界坐标 → 草皮落点（透视：远端窄、近端宽） */
  Engine.prototype.pitchPoint = function (u, v) {
    const A = this.A;
    const spread = 0.52 + 0.62 * v;
    const nx = 0.5 + (u - 0.5) * spread * 1.55;
    const ny = A.pitchTop + v * (1.0 - A.pitchTop);
    return { x: this.px(nx), y: this.py(ny), v: v };
  };

  Engine.prototype.setCloudSpeed = function (v) { this.cloudSpeed = U.clamp(v, 0, 3); };
  Engine.prototype.setRainAmount = function (v) { this.rainAmount = U.clamp(v, 0, 1.4); };
  Engine.prototype.setGlassAmount = function (v) { this.glassAmount = U.clamp(v, 0, 1.6); };
  Engine.prototype.setPaused = function (p) { this.paused = !!p; };
  Engine.prototype.destroy = function () {
    global.removeEventListener('resize', this._onResize);
    global.removeEventListener('mousemove', this._onMove);
    global.removeEventListener('touchmove', this._onMove);
  };

  global.SEngine = Engine;
  global.SANCHORS = A;
})(window);

</script>
<script>
/* ============================================================================
 * boot.js — 场景页面启动脚本（四个页面共用）
 *   URL 参数：?t=12 定格时间（截图/自检）· nohud=1 只留画面
 *             speed=0.5 云速 · rain=0.6 雨量 · glass=0 关玻璃雨滴
 *   键盘：空格 暂停 · 1~4 切换场景 · H 隐藏界面
 * ==========================================================================*/
(function () {
  'use strict';
  const U = window.SU, SC = window.SCENE_PROFILES, Engine = window.SEngine;
  const ID = window.__SCENE_ID__;
  const SCENES = window.__SCENES__ || [];
  const qs = new URLSearchParams(location.search);
  const num = function (k, d) { const v = parseFloat(qs.get(k)); return isFinite(v) ? v : d; };

  const stageC = document.getElementById('stage');
  const fxC = document.getElementById('fx');
  const raysC = document.getElementById('rays');   // WebGL 体积光层（不支持时引擎自动退回 2D 光柱）
  const diag = document.getElementById('diag');
  const errBox = document.getElementById('err');
  let engine = null, diagTimer = 0;

  function fail(msg) {
    errBox.style.display = 'block';
    errBox.textContent = String(msg).slice(0, 600);
    document.title = '⚠ ' + ID + ' :: ' + String(msg).slice(0, 120);
    window.__error = String(msg);
  }
  window.__onEngineError = function (e) { fail((e && (e.stack || e.message)) || e); };
  window.addEventListener('error', function (e) { fail(e.message); });

  /* ---------------- HUD ---------------- */
  document.documentElement.style.setProperty('--accent', SC[ID].accent);
  document.title = ID + ' · ' + SC[ID].name + ' · 球场四景';
  document.querySelectorAll('#tabs a').forEach(function (a) {
    a.classList.toggle('on', a.dataset.scene === ID);
  });
  // 切换场景时保留"定格时间 / 隐藏界面"这类参数
  (function () {
    const keep = [];
    if (qs.has('t')) keep.push('t=' + qs.get('t'));
    if (qs.get('nohud') === '1') keep.push('nohud=1');
    if (!keep.length) return;
    document.querySelectorAll('#tabs a').forEach(function (a) {
      a.setAttribute('href', a.getAttribute('href').split('?')[0] + '?' + keep.join('&'));
    });
  })();
  if (qs.get('nohud') === '1') {
    document.querySelectorAll('.hud').forEach(function (n) { n.classList.add('hide'); });
    const b0 = document.getElementById('boot');
    if (b0) b0.style.display = 'none';
  }

  function bindRange(el) {
    if (!el) return null;
    const out = el.parentNode.querySelector('output');
    const show = function () { if (out) out.textContent = Number(el.value).toFixed(2).replace(/0$/, ''); };
    el.addEventListener('input', show); show();
    return el;
  }
  const ctlCloud = bindRange(document.querySelector('[data-ctl="cloud"]'));
  const ctlRain = bindRange(document.querySelector('[data-ctl="rain"]'));
  const ctlGlass = bindRange(document.querySelector('[data-ctl="glass"]'));
  const btnPause = document.getElementById('btnPause');
  const btnHud = document.getElementById('btnHud');

  if (btnHud) btnHud.addEventListener('click', function () {
    document.querySelectorAll('.hud').forEach(function (n) { n.classList.toggle('hide'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'h' || e.key === 'H') { document.querySelectorAll('.hud').forEach(function (n) { n.classList.toggle('hide'); }); }
    else if (e.key >= '1' && e.key <= '4') {
      const s = SCENES[parseInt(e.key, 10) - 1];
      if (s) location.href = s.file;
    }
  });
  let paused = false;
  function togglePause() {
    if (!engine) return;
    paused = !paused;
    engine.setPaused(paused);
    if (btnPause) btnPause.textContent = paused ? '▶ 继续' : '❚❚ 暂停';
  }
  if (btnPause) btnPause.addEventListener('click', togglePause);

  /* ---------------- 启动 ---------------- */
  const fixed = qs.has('t') ? num('t', 12) : undefined;
  const tileSrc = window.__CLOUD_TILE__ || null;   // 实拍云层贴图（只有用实拍素材的场景才有）
  Promise.all([
    U.loadImage(window.__STADIUM_SRC__),
    tileSrc ? U.loadImage(tileSrc) : Promise.resolve(null)
  ]).then(function (imgs) {
    const img = imgs[0], tile = imgs[1];
    engine = new Engine({
      mode: ID, image: img, cloudTile: tile, canvas: stageC, fxCanvas: fxC,
      raysCanvas: raysC, raysOff: qs.has('rays') && parseFloat(qs.get('rays')) === 0,
      fixedTime: fixed
    });
    window.__engine = engine;
    if (qs.has('speed')) engine.setCloudSpeed(num('speed', 1));
    if (qs.has('rain')) engine.setRainAmount(num('rain', 1));
    if (qs.has('glass')) engine.setGlassAmount(num('glass', 1));
    // ?fx=0 关掉暗角与胶片颗粒（想省一点算力时用）
    if (qs.has('fx') && parseFloat(qs.get('fx')) === 0) engine.fxOff = true;
    if (ctlCloud) { ctlCloud.value = engine.cloudSpeed; ctlCloud.dispatchEvent(new Event('input')); }
    if (ctlRain) { ctlRain.value = engine.rainAmount; ctlRain.dispatchEvent(new Event('input')); }
    if (ctlGlass) { ctlGlass.value = engine.glassAmount; ctlGlass.dispatchEvent(new Event('input')); }
    if (ctlCloud) ctlCloud.addEventListener('input', function () { engine.setCloudSpeed(parseFloat(ctlCloud.value)); });
    if (ctlRain) ctlRain.addEventListener('input', function () { engine.setRainAmount(parseFloat(ctlRain.value)); });
    if (ctlGlass) ctlGlass.addEventListener('input', function () { engine.setGlassAmount(parseFloat(ctlGlass.value)); });

    engine.renderAt(fixed === undefined ? 0 : fixed);   // 立刻出第一帧（截图不等 rAF）
    engine.start();
    const boot = document.getElementById('boot');
    if (boot) { boot.classList.add('gone'); setTimeout(function () { boot.style.display = 'none'; }, 600); }
    window.__ready = true;
    diagTimer = setInterval(updateDiag, 400);
    updateDiag();
  }).catch(function (e) { fail('背景图加载失败：' + (e && e.message)); });

  /* ---------------- 状态 ---------------- */
  function updateDiag() {
    if (!engine || !diag) return;
    const st = engine.stats, s = engine.state;
    const info = {
      scene: ID, fps: +st.fps.toFixed(1), ms: +st.ms.toFixed(2), frames: st.frames,
      err: engine.errors.length, sunVis: +s.sunVis.toFixed(3), occ: +s.occ.toFixed(3),
      cloudSpeed: engine.cloudSpeed, rain: engine.rainAmount, glass: engine.glassAmount,
      dpr: +engine.dpr.toFixed(2), size: engine.CW + 'x' + engine.CH
    };
    diag.setAttribute('data-diag', JSON.stringify(info));
    window.__diag = info;
    diag.innerHTML = '<b>' + info.fps.toFixed(0) + '</b> fps · <b>' + info.ms.toFixed(1) + '</b> ms'
      + (engine.S.rain ? ' · 雨滴 <b>' + engine.rainCount() + '</b>' : '')
      + ' · 云影 <b>' + Math.round((1 - info.sunVis) * 100) + '%</b>'
      + (info.err ? ' · <b style="color:#ff9b9b">错误 ' + info.err + '</b>' : '');
  }
})();

</script>
</body>
