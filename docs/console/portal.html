<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足球数据分析与 AI 预测系统 · 完整演示</title>
<style>
  :root{
    --bg:#07130d; --surface:#0d1b14; --border:#1e3529; --text:#e8f5ec;
    --muted:#8fa79a; --primary:#2ebd85;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;padding:9px 12px;
    background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{font-weight:650;font-size:14px;line-height:1.25;white-space:nowrap}
  .brand small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);
    letter-spacing:.08em;margin-top:1px}
  .grow{flex:1 1 auto}
  select,button{font:inherit;color:var(--text);background:#0b1a13;border:1px solid var(--border);
    border-radius:9px;padding:6px 9px;cursor:pointer;transition:border-color .15s,background .15s}
  select option,select optgroup{background:#0b1a13;color:var(--text)}
  select:hover,button:hover{border-color:#2a4a39}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--primary);color:#04150e;border-color:transparent;font-weight:600}
  button.primary:hover{background:#35cf93}
  .hint{font-size:11.5px;color:var(--muted);padding:5px 12px;background:#0a1710;
    border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
  .hint b{color:#b9d6c6;font-weight:600}
  #stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--bg)}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;
    background:var(--bg);display:block;transform-origin:0 0;transition:transform .18s}
  button.on{background:#12301f;border-color:var(--primary);color:#d6f2e4}
  /* 全部页面模式: 14 页纵向排开, 每页一个真实 iframe */
  #allWrap{position:absolute;top:0;left:0;right:0;bottom:0;overflow:auto;display:none;--s:1}
  #allWrap.on{display:block}
  .ab{border-bottom:1px solid var(--border)}
  .abh{display:flex;align-items:baseline;gap:8px;padding:9px 12px 7px;flex-wrap:wrap;
    position:sticky;top:0;z-index:2;background:#0a1710;border-bottom:1px solid var(--border)}
  .abh .n{font:600 12px/1 ui-monospace,Consolas,monospace;color:var(--primary)}
  .abh b{font-size:13.5px}
  .abh .p{font-size:11px;color:var(--muted)}
  .abh .d{flex:1 1 100%;font-size:11.5px;color:var(--muted)}
  .abh a{margin-left:auto;font-size:11.5px;color:#7fd3ae;text-decoration:none}
  .abv{position:relative;overflow:hidden;height:calc(1040px * var(--s,1))}
  .abf{position:absolute;top:0;left:0;width:1440px;height:1040px;border:0;
    background:var(--bg);transform:scale(var(--s,1));transform-origin:0 0}
  .err{padding:18px;color:#ffb4a8;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">足球数据分析与 AI 预测系统
    <small>FOOTBALL ANALYTICS · 完整演示</small>
  </div>
  <span class="grow"></span>
  <select id="sel" title="切换页面"></select>
  <button id="fit" title="窄栏下缩小整页以便完整可见">适配宽度</button>
  <button id="reload" title="重新加载当前页">↻</button>
  <button id="pop" class="primary" title="在新窗口打开">↗</button>
</header>
<div class="hint" id="hint"></div>
<div id="stage">
  <iframe id="fv" title="系统页面" referrerpolicy="no-referrer"></iframe>
  <div id="allWrap"></div>
</div>

<script>
// 14 个页面: 用户端 8 (8501) + 管理后台 6 (8502)。
// slug 与前端 app.py / admin.py 里的 ?page= 深链一一对应。
const PAGES = [
  { slug:'home',    label:'首页概览',      port:8501, group:'用户端 · 8 个页面',
    desc:'英雄版块 · 关键指标 · 核心功能 · 数据分布' },
  { slug:'leagues', label:'联赛数据',      port:8501, group:'用户端 · 8 个页面',
    desc:'积分榜 · 球队实力 Elo · 各赛事技术风格' },
  { slug:'teams',   label:'球队分析',      port:8501, group:'用户端 · 8 个页面',
    desc:'双队对比 · 能力雷达 · 近期状态 · 历史交锋' },
  { slug:'players', label:'球员分析',      port:8501, group:'用户端 · 8 个页面',
    desc:'球员检索 · 能力雷达 · 伤病转会 · 身价走势' },
  { slug:'match',   label:'比赛详情',      port:8501, group:'用户端 · 8 个页面',
    desc:'技术统计 · 首发阵容 · 事件时间轴 · 伤停名单' },
  { slug:'predict', label:'比赛预测',      port:8501, group:'用户端 · 8 个页面',
    desc:'单场预测 · 批量预测 · 历史预测复盘' },
  { slug:'agent',   label:'AI 智能分析',   port:8501, group:'用户端 · 8 个页面',
    desc:'自然语言问答 · 6 个数据工具 · 深度分析报告' },
  { slug:'live',    label:'实时比分',      port:8501, group:'用户端 · 8 个页面',
    desc:'进行中比赛 · 实时比分推送 · 服务状态' },
  { slug:'overview',label:'数据概览',      port:8502, group:'管理后台 · 6 个页面',
    desc:'模块数据量 · 数据分布 · 系统状态检查' },
  { slug:'browse',  label:'数据浏览',      port:8502, group:'管理后台 · 6 个页面',
    desc:'按主题浏览 10 个数据主题 · 33 张图表' },
  { slug:'api',     label:'API 接口测试',  port:8502, group:'管理后台 · 6 个页面',
    desc:'RESTful 接口在线调试与响应查看' },
  { slug:'database',label:'数据库管理',    port:8502, group:'管理后台 · 6 个页面',
    desc:'27 张数据表 · 字段结构 · 行数统计' },
  { slug:'update',  label:'数据更新控制',  port:8502, group:'管理后台 · 6 个页面',
    desc:'API Key 配置 · 赛程同步 · 更新日志' },
  { slug:'models',  label:'模型管理',      port:8502, group:'管理后台 · 6 个页面',
    desc:'样本外评估 · 混淆矩阵 · 校准曲线 · McNemar 检验' },
];

const sel = document.getElementById('sel');
const fv = document.getElementById('fv');
const hint = document.getElementById('hint');
const BASE = { '8501':'http://127.0.0.1:8501', '8502':'http://127.0.0.1:8502' };

function urlOf(p){ return BASE[p.port] + '/?page=' + p.slug; }

// 下拉: 按分组生成 optgroup
(function buildSelect(){
  const groups = {};
  PAGES.forEach(p => (groups[p.group] = groups[p.group] || []).push(p));
  Object.keys(groups).forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g;
    groups[g].forEach(p => {
      const o = document.createElement('option');
      o.value = p.slug;
      o.textContent = p.label;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
})();

function bySlug(s){ return PAGES.find(p => p.slug === s) || PAGES[0]; }

// 下拉最前面插入「全部 14 页」分组
(function addAllOption(){
  const og = document.createElement('optgroup');
  og.label = '全部页面 · 完整展示';
  const o = document.createElement('option');
  o.value = '__all';
  o.textContent = '全部 14 页（纵向完整排列）';
  og.appendChild(o);
  sel.insertBefore(og, sel.firstChild);
})();

// ---- 全部页面模式: 一次性把 14 个真实页面排开 ----
const allWrap = document.getElementById('allWrap');
let mode = 'single', allBuilt = false;

// ---- 适配宽度: 窄栏里把整页(按 1440px 视口)等比缩小, 避免侧栏挤掉内容 ----
// 注意: 必须声明在 show()/init() 之前 —— applyFit 由 show() 调用,
// 若 const stage/fitBtn 在其后声明会触发 TDZ ReferenceError(首次调用即中断)。
const stage = document.getElementById('stage');
const fitBtn = document.getElementById('fit');
let fitOn = stage.clientWidth < 1100;          // 窄栏默认开启
function applyFit(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const s = fitOn ? Math.min(1, w / 1440) : 1;
  if (mode === 'all'){
    allWrap.style.setProperty('--s', s);
    allWrap.querySelectorAll('.abv').forEach(bx => {
      bx.style.overflow = s === 1 ? 'auto' : 'hidden';   // 不缩放时允许横向滚动看全宽
    });
  } else if (fitOn && w > 0){
    fv.style.width = '1440px';
    fv.style.height = (h / s) + 'px';
    fv.style.transform = 'scale(' + s + ')';
  } else {
    fv.style.width = '100%';
    fv.style.height = '100%';
    fv.style.transform = 'none';
  }
  fitBtn.classList.toggle('on', fitOn);
  fitBtn.textContent = fitOn ? '适配宽度 · 开' : '适配宽度 · 关';
}
fitBtn.addEventListener('click', () => { fitOn = !fitOn; applyFit(); });
window.addEventListener('resize', applyFit);

function buildAll(){
  if (allBuilt) return;
  PAGES.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'ab';
    const hd = document.createElement('div');
    hd.className = 'abh';
    hd.innerHTML = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>'
      + '<b>' + p.label + '</b>'
      + '<span class="p">:' + p.port + ' · ' + p.group + '</span>'
      + '<a href="' + urlOf(p) + '" target="_blank" rel="noopener">新窗口打开 ↗</a>'
      + '<span class="d">' + p.desc + '</span>';
    const box = document.createElement('div');
    box.className = 'abv';
    const fr = document.createElement('iframe');
    fr.className = 'abf';
    fr.setAttribute('loading', 'lazy');
    fr.setAttribute('referrerpolicy', 'no-referrer');
    fr.src = urlOf(p);
    box.appendChild(fr);
    sec.appendChild(hd);
    sec.appendChild(box);
    allWrap.appendChild(sec);
  });
  allBuilt = true;
}

function show(slug, push){
  if (slug === '__all'){
    mode = 'all';
    buildAll();
    allWrap.classList.add('on');
    fv.style.display = 'none';
    sel.value = '__all';
    hint.innerHTML = '<span><b>全部 14 页</b> · 向下滚动逐页查看，每页都是运行中的真实系统</span>'
      + '<span>用户端 8 页 + 管理后台 6 页 · 页面内可正常交互</span>';
    try { localStorage.setItem('fv_page', '__all'); } catch(e){}
    if (push !== false) history.replaceState(null, '', '#__all');
    applyFit();
    return;
  }
  mode = 'single';
  allWrap.classList.remove('on');
  fv.style.display = 'block';
  const p = bySlug(slug);
  sel.value = p.slug;
  hint.innerHTML = '<span><b>' + p.label + '</b> · ' + p.desc + '</span>'
    + '<span>' + p.group + ' · 页面内可正常交互</span>';
  fv.src = urlOf(p);
  try { localStorage.setItem('fv_page', p.slug); } catch(e){}
  if (push !== false) history.replaceState(null, '', '#' + p.slug);
  applyFit();
}

sel.addEventListener('change', e => show(e.target.value));
document.getElementById('reload').addEventListener('click', () => {
  fv.src = fv.src;                       // 重新加载 iframe
});
document.getElementById('pop').addEventListener('click', () => {
  window.open(urlOf(bySlug(sel.value)), '_blank', 'noopener');
});

// 初始页: URL hash > 上次选择 > 首页概览
(function init(){
  const hash = (location.hash || '').replace('#','');
  let last = null;
  try { last = localStorage.getItem('fv_page'); } catch(e){}
  show(hash || last || 'home', false);
  applyFit();
})();

// 页面加载失败提示(端口未启动时)
fv.addEventListener('error', () => {
  fv.insertAdjacentHTML('afterend',
    '<div class="err">页面加载失败：请确认本地服务已启动（8000 API / 8501 用户端 / 8502 管理后台）。</div>');
});
</script>
</body>
</html>
