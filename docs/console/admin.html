@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  /* screen skeleton */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
</style>
<style data-od-inline-asset="styles.css">/* ============================================================
   足球数据分析与 AI 预测系统 · 控制台
   设计系统：Data Command — 深炭底 / 单一球场绿强调 / 等宽数字
   ============================================================ */

:root{
  /* 纸面（对齐参照稿「晴空蓝玻璃仪表盘」：蓝白纸面 + 白玻璃卡） */
  --bg:#e8f1fb;
  --bg-2:#f1f7fd;
  --panel:rgba(255,255,255,.86);
  --panel-2:#ffffff;
  --panel-3:#f1f7fd;
  --line:rgba(30,64,110,.14);
  --line-2:#d7e4f2;
  --text:#14202e;
  --text-2:#3c4c60;
  --text-3:#5d6d80;
  /* 主色 = 参照稿的天蓝 #4090e0 一族 */
  --accent:#2f86e0;
  --accent-2:#1f6fc4;
  --accent-deep:#17539a;
  --accent-soft:rgba(47,134,224,.10);
  --accent-tint:#cfe4f8;
  --accent-ink:#ffffff;
  --warm-glow:rgba(122,182,245,.45);
  --cool-glow:rgba(140,206,240,.34);
  --amber:#c8871a;
  --red:#d0453c;
  --blue:#2aa3c9;
  --violet:#5b6f8c;

  --radius:22px;
  --radius-sm:14px;
  --radius-xs:10px;
  --radius-pill:999px;
  --shadow:0 30px 70px -28px rgba(21,54,99,.28), 0 12px 26px -16px rgba(21,54,99,.16);
  --shadow-sm:0 10px 24px -14px rgba(21,54,99,.22);
  --hair:rgba(30,64,110,.12);
  --glass:rgba(255,255,255,.56);
  --sidebar-w:252px;
  --topbar-h:66px;
  --pad:26px;

  --font-sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Cascadia Mono",ui-monospace,"DejaVu Sans Mono",Consolas,monospace;
  /* 展示体：登录页的 Cormorant Garamond → Georgia → 中文回落 */
  --font-display:"Cormorant Garamond","PP Editorial New",Georgia,"Times New Roman","Songti SC","PingFang SC","Microsoft YaHei",serif;

  --ease-out:cubic-bezier(.16,.84,.44,1);
  --ease-in:cubic-bezier(.5,0,.75,0);
  --ease:cubic-bezier(.2,.75,.2,1);
}

*,*::before,*::after{box-sizing:border-box}

html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:400 15px/1.6 var(--font-sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 620px at 82% -14%, var(--warm-glow), transparent 62%),
    radial-gradient(860px 560px at -8% 110%, var(--cool-glow), transparent 64%),
    radial-gradient(rgba(19,26,33,.055) 1px, transparent 1.4px);
  background-size:auto,auto,22px 22px;
}

h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.accent{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft);color:#fff}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e4ebf2;border:3px solid var(--bg);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#d6e0ea}

/* ---------- route progress ---------- */
.route-progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:90;
  background:linear-gradient(90deg,var(--accent),#86c9d8);opacity:0;transition:width .3s var(--ease-out),opacity .25s}
.route-progress.on{opacity:1}
.route-progress.done{width:100%!important;opacity:0;transition:width .2s ease,opacity .4s .15s}

/* ============================================================
   App layout
   ============================================================ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.brand-mark{flex:none;width:34px;height:34px;color:var(--accent);display:grid;place-items:center;
  background:var(--accent-soft);border:1px solid rgba(47,134,224,.28);border-radius:10px}
.brand-mark svg{width:22px;height:22px}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text b{font-size:14.5px;font-weight:650;letter-spacing:.005em;white-space:nowrap}
.brand-text small{font:500 9.5px/1 var(--font-mono);letter-spacing:.16em;color:var(--text-3);margin-top:3px}

.nav{flex:1 1 auto;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;gap:2px}
.nav-group{margin-top:14px;padding:0 8px 7px;font:600 10px/1 var(--font-mono);letter-spacing:.16em;
  color:var(--text-3);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.nav-group:first-child{margin-top:2px}
.nav-group::after{content:"";flex:1;height:1px;background:var(--line)}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:9px;color:var(--text-2);
  font-size:13.5px;font-weight:500;transition:color .16s,background .16s;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85;transition:opacity .16s,transform .2s var(--ease-out)}
.nav-item .nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .nav-key{font:500 10px/1 var(--font-mono);color:var(--text-3);opacity:0;transition:opacity .16s}
.nav-item:hover{color:var(--text);background:var(--panel)}
.nav-item:hover svg{opacity:1}
.nav-item.active{color:#131a21;background:linear-gradient(90deg,var(--accent-soft),rgba(47,134,224,.04))}
.nav-item.active svg{color:var(--accent);opacity:1}
.nav-item.active .nav-key{opacity:.6}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}

.sidebar-foot{padding:12px 14px 14px;border-top:1px solid var(--line)}
.svc-mini{display:flex;flex-direction:column;gap:7px}
.svc-mini .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2)}
.svc-mini .row .port{margin-left:auto;font:500 10.5px/1 var(--font-mono);color:var(--text-3)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text-3);position:relative}
.dot.ok{background:var(--accent);box-shadow:0 0 0 3px rgba(47,134,224,.14)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(169,116,26,.14)}
.dot.live{background:var(--red)}
.dot.live::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--red);animation:ping 1.6s var(--ease-out) infinite}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:var(--topbar-h) minmax(0,1fr) 34px;min-width:0;height:100vh}

.topbar{
  display:flex;align-items:center;gap:14px;padding:0 22px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  position:relative;z-index:5;
}
.menu-btn{display:none}
.tb-title{min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-title h1{font-size:18px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.demo-badge{font:600 10.5px/1 var(--font-mono);letter-spacing:.1em;color:var(--amber);
  padding:6px 9px;border:1px solid rgba(169,116,26,.3);background:rgba(169,116,26,.08);border-radius:7px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:550;
  border:1px solid var(--line-2);background:var(--panel);color:var(--text);
  transition:background .16s,border-color .16s,transform .12s,color .16s}
.btn:hover{background:var(--panel-3);border-color:#c9d4e0}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650}
.btn-primary:hover{background:#1f6fc4}
.btn-ghost{background:transparent;border-color:var(--line-2)}
.btn-ghost:hover{background:var(--panel)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;
  color:var(--text-2);transition:background .16s,color .16s,border-color .16s}
.icon-btn:hover{background:var(--panel);color:var(--text);border-color:var(--line)}
.icon-btn svg{width:18px;height:18px}

/* ---------- content ---------- */
.content{overflow-y:auto;overscroll-behavior:contain;padding:var(--pad);position:relative}
.content:focus{outline:none}
.view{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:2px}
.view-head .eyebrow{font:600 10.5px/1 var(--font-mono);letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.view-head h2{font-size:22px;font-weight:680;letter-spacing:-.015em;margin-top:8px}
.view-head p{color:var(--text-2);font-size:13px;margin-top:5px;max-width:64ch}
.view-head .head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* entrance animation */
.rise{opacity:0;animation:riseIn .5s var(--ease-out) forwards;animation-delay:calc(var(--i,0)*38ms)}

/* ============================================================
   Panels & primitives
   ============================================================ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);pointer-events:none}
.panel-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:14px;font-weight:620;letter-spacing:-.005em}
.panel-head .sub{font-size:11.5px;color:var(--text-3)}
.panel-head .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-body{padding:18px}
.panel-body.tight{padding:12px}
.panel-body.flush{padding:0}
.section-label{font:600 10px/1 var(--font-mono);letter-spacing:.16em;color:var(--text-3);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.split-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px;align-items:start}
.span-2{grid-column:span 2}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--radius-pill);
  border:1px solid var(--line-2);background:var(--panel);font-size:12px;color:var(--text-2);transition:.16s;white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip:hover{border-color:#c9d4e0;color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:rgba(47,134,224,.4);color:#17539a}
.chip.on svg{color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:550;
  border:1px solid var(--line-2);color:var(--text-2);background:var(--panel-2);white-space:nowrap}
.tag.g{color:#17539a;border-color:rgba(47,134,224,.32);background:rgba(47,134,224,.08)}
.tag.a{color:#8a5c10;border-color:rgba(169,116,26,.3);background:rgba(169,116,26,.08)}
.tag.r{color:#8f2a1e;border-color:rgba(208,69,60,.3);background:rgba(208,69,60,.08)}
.tag.b{color:#2c5c80;border-color:rgba(63,124,168,.3);background:rgba(63,124,168,.08)}
.form-chips{display:inline-flex;gap:3px}
.form-chips i{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;font:700 9.5px/1 var(--font-mono);font-style:normal}
.form-chips i.W{background:rgba(47,134,224,.16);color:#17539a}
.form-chips i.D{background:rgba(19,26,33,.14);color:#3e4a57}
.form-chips i.L{background:rgba(208,69,60,.15);color:#8f2a1e}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text-2);font-weight:550}
.input,.select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);
  font:inherit;font-size:13.5px;transition:border-color .16s,background .16s}
.input:hover,.select:hover{border-color:#c9d4e0}
.input:focus,.select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.input::placeholder{color:var(--text-3)}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237c8e84' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3)}
.search .input{padding-left:34px}

/* segmented control */
.segmented{display:inline-flex;padding:3px;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px}
.segmented button{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--text-2);transition:.16s;position:relative}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--panel-3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.60) inset}
.segmented button.on::after{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:16px;height:2px;border-radius:2px;background:var(--accent)}

/* ============================================================
   Stats & data display
   ============================================================ */
.stat{display:flex;flex-direction:column;gap:6px;padding:16px 16px 15px}
.stat .stat-label{font:600 10px/1 var(--font-mono);letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
.stat .stat-value{font:600 30px/1.05 var(--font-mono);letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px;white-space:nowrap;color:var(--text)}
.stat .stat-value .unit{font-size:13px;color:var(--text-2);font-weight:500}
.stat .stat-foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3)}
.stat .stat-delta{font-weight:600}
.stat-delta.up{color:var(--accent)}
.stat-delta.down{color:var(--red)}
.stat .spark{margin-top:2px}
.stat-foot svg,.stat-delta svg,.stat-value svg{width:13px;height:13px;vertical-align:-2px}
.hero-tag svg{width:13px;height:13px}
.fn-card .go svg{width:17px;height:17px}
.ticker .tk-label svg{width:14px;height:14px}
.db-item svg{width:15px;height:15px;flex:none;color:var(--text-3)}
.api-line .fi svg{width:16px;height:16px}
.api-line .fi{display:grid;place-items:center}
.schema-col .pk svg{width:14px;height:14px}
.stat .od-row .fi svg,.panel .fi svg{width:16px;height:16px}

.meter{display:flex;flex-direction:column;gap:7px}
.meter-top{display:flex;align-items:baseline;gap:8px;font-size:13px}
.meter-top .meter-label{color:var(--text-2)}
.meter-top .meter-value{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--text)}
.meter-track{height:7px;border-radius:999px;background:var(--panel-3);overflow:hidden;position:relative}
.meter-fill{height:100%;border-radius:999px;background:var(--accent);width:0;transition:width .8s var(--ease-out)}
.meter-fill.alt{background:var(--blue)}
.meter-fill.warn{background:var(--amber)}
.meter-fill.red{background:var(--red)}
.meter-fill.dim{background:#cbd5df}

.dual{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:12px;font-size:13px}
.dual .v{font-family:var(--font-mono);font-size:14px;font-weight:600}
.dual .v.l{text-align:right;color:#17539a}
.dual .v.r{text-align:left}
.dual .track{position:relative;height:8px;border-radius:999px;background:var(--panel-3);overflow:hidden;display:flex}
.dual .track .seg{height:100%;transition:width .9s var(--ease-out)}
.dual .track .seg.l{background:var(--accent)}
.dual .track .seg.r{background:var(--blue)}
.dual .mid{grid-column:1/-1;text-align:center;font-size:11.5px;color:var(--text-3);margin-bottom:-4px}

/* table */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.tbl thead th{position:sticky;top:0;background:var(--panel);text-align:left;font:600 10.5px/1 var(--font-mono);
  letter-spacing:.1em;color:var(--text-3);text-transform:uppercase;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tbl tbody td{padding:10px 12px;border-bottom:1px solid rgba(19,26,33,.6);vertical-align:middle}
.tbl tbody tr{transition:background .14s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr.hl{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .rank{width:34px;color:var(--text-3);font-family:var(--font-mono);font-size:12px}
.tbl .rank.ucl{color:var(--accent);font-weight:700}
.tbl .rank.rel{color:var(--red)}
.team-cell{display:flex;align-items:center;gap:10px;min-width:0}
.team-cell img{width:22px;height:22px;object-fit:contain;flex:none}
.team-cell .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-cell .nm b{font-weight:550}

.crest{width:26px;height:26px;object-fit:contain;flex:none}
.crest-lg{width:44px;height:44px;object-fit:contain;flex:none}
.crest-xl{width:64px;height:64px;object-fit:contain;flex:none}

/* avatar (monogram) */
.avatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
  font:650 14px/1 var(--font-sans);color:#131a21;background:var(--panel-3);border:1px solid var(--line-2);letter-spacing:.02em}
.avatar.sm{width:30px;height:30px;border-radius:9px;font-size:12px}
.avatar.lg{width:56px;height:56px;border-radius:14px;font-size:19px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(19,26,33,.6);transition:background .14s}
.row-item:last-child{border-bottom:0}
.row-item:hover{background:var(--panel-2)}
.row-item .grow{flex:1;min-width:0}

/* match / fixture */
.fixture{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.fixture .side{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.fixture .side.away{flex-direction:row-reverse;text-align:right}
.fixture .side .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fixture .score{font:700 30px/1 var(--font-mono);letter-spacing:-.02em;white-space:nowrap}
.fixture .vs{font:700 20px/1 var(--font-mono);color:var(--text-3)}
.fixture .meta{font-size:11.5px;color:var(--text-3)}

/* prediction bar */
.prob{display:flex;flex-direction:column;gap:10px}
.prob-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--panel-3)}
.prob-bar .p{transition:width .9s var(--ease-out)}
.prob-bar .win{background:var(--accent)}
.prob-bar .draw{background:#b8c2cc}
.prob-bar .lose{background:var(--blue)}
.prob-legend{display:flex;justify-content:space-between;font-size:12px}
.prob-legend .k{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.prob-legend .k i{width:9px;height:9px;border-radius:3px;display:block}
.prob-legend .v{margin-left:auto;font-family:var(--font-mono);color:var(--text)}

/* heatmap */
.heat{display:grid;gap:3px}
.heat .hc{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font:600 10px/1 var(--font-mono);color:var(--text-2);
  background:var(--panel-2);transition:transform .18s}
.heat .hc:hover{transform:scale(1.08)}
.heat .hl{font:600 9.5px/1 var(--font-mono);color:var(--text-3);display:grid;place-items:center}

/* timeline */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-23px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line-2)}
.tl-item.goal::before{border-color:var(--accent);background:var(--accent)}
.tl-item.card::before{border-color:var(--amber)}
.tl-item.sub::before{border-color:var(--blue)}
.tl-minute{font:650 11px/1 var(--font-mono);color:var(--accent)}
.tl-title{font-size:13.5px;font-weight:550;margin-top:5px}
.tl-desc{font-size:12px;color:var(--text-3);margin-top:2px}

/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:68/100;max-height:520px;margin:0 auto;
  border-radius:10px;overflow:hidden;border:1px solid var(--line-2);
  background:
    repeating-linear-gradient(0deg,#eaf0f6,#eaf0f6 8.5%,#e2eaf2 8.5%,#e2eaf2 17%);
}
.pitch .line{position:absolute;border:1px solid rgba(19,26,33,.14)}
.pitch .dot{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;display:grid;place-items:center;
  font:700 9.5px/1 var(--font-mono);color:#131a21;background:#cfe4f8;border:1px solid rgba(47,134,224,.5);
  box-shadow:0 4px 10px -4px rgba(14,28,45,.30)}
.pitch .dot.away{background:#dbe7f3;border-color:rgba(63,124,168,.5)}

/* chat */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:11px;max-width:88%}
.msg .who{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font:650 11px/1 var(--font-sans)}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg.user .who{background:var(--panel-3);color:var(--text-2)}
.msg.ai .who{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(47,134,224,.3)}
.bubble{padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.65;border:1px solid var(--line);background:var(--panel-2)}
.msg.user .bubble{background:var(--panel-3);border-color:var(--line-2)}
.msg.ai .bubble{background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.bubble .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
.chat-input{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--bg-2)}

/* code / json */
.code{font:12.5px/1.65 var(--font-mono);background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;overflow:auto;color:#cfe3d8;max-height:420px;white-space:pre}
.code .k{color:#17539a}
.code .s{color:#c8871a}
.code .n{color:#2c5c80}
.code .b{color:var(--violet)}

/* misc */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;font-family:var(--font-mono);text-align:right}
.empty{padding:34px 20px;text-align:center;color:var(--text-3);font-size:13px}
.hintline{font-size:11.5px;color:var(--text-3)}
.divider{height:1px;background:var(--line);margin:2px 0}
.scroll-rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.pill-list{display:flex;flex-wrap:wrap;gap:8px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid-line{stroke:rgba(19,26,33,.1);stroke-width:1}
.chart .axis{fill:var(--text-3);font-size:9.5px;font-family:var(--font-mono)}
.chart .bar{transition:transform .6s var(--ease-out);transform-box:fill-box}
.radar-poly{opacity:0;animation:radarIn .7s var(--ease-out) forwards}
.radar-poly.b{animation-delay:.12s}

/* ticker */
.ticker{display:flex;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel);height:38px;align-items:center}
.ticker .tk-label{flex:none;padding:0 14px;height:100%;display:flex;align-items:center;gap:7px;
  background:var(--accent-soft);color:var(--accent);font:650 11px/1 var(--font-mono);letter-spacing:.1em;border-right:1px solid var(--line)}
.ticker .tk-track{flex:1;overflow:hidden}
.ticker .tk-inner{display:flex;gap:34px;white-space:nowrap;padding-left:16px;animation:marquee 34s linear infinite}
.ticker:hover .tk-inner{animation-play-state:paused}
.ticker .tk-item{font-size:12.5px;color:var(--text-2);display:inline-flex;gap:8px;align-items:center}
.ticker .tk-item b{color:var(--text);font-family:var(--font-mono)}

/* statusbar */
.statusbar{display:flex;align-items:center;gap:16px;padding:0 18px;border-top:1px solid var(--line);
  background:var(--bg-2);font-size:11.5px;color:var(--text-3)}
.sb-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.sb-left .s{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sb-right{margin-left:auto;display:flex;gap:14px;white-space:nowrap}

/* mobile drawer scrim */
.scrim{position:fixed;inset:0;background:rgba(19,26,33,.6);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}

/* ============================================================
   Keyframes
   ============================================================ */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes radarIn{from{opacity:0;transform:scale(.92);transform-origin:center}to{opacity:1;transform:scale(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(1.9);opacity:0}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulseNum{0%{color:var(--accent)}100%{color:var(--text)}}
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growRight{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.chart .bar{transform-origin:center bottom;animation:growUp .62s var(--ease-out) both;animation-delay:calc(var(--i,0)*42ms)}
.chart .hbar{transform-origin:left center;animation:growRight .62s var(--ease-out) both;animation-delay:calc(var(--i,0)*42ms)}

/* ============================================================
   View components
   ============================================================ */
.fn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fn-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);transition:border-color .18s,background .18s,transform .18s var(--ease-out);text-align:left;width:100%}
.fn-card:hover{border-color:#c9d4e0;background:var(--panel-3);transform:translateY(-2px)}
.fn-card:hover .go{transform:translateX(3px);color:var(--accent)}
.fn-card .fi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fn-card .fi svg{width:18px;height:18px}
.fn-card b{font-size:13.5px;font-weight:600;display:block}
.fn-card p{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.fn-card .go{margin-left:auto;color:var(--text-3);transition:transform .18s,color .18s;flex:none}

.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
.hero-main{padding:24px;border-right:1px solid var(--line)}
.hero-side{padding:24px;display:flex;flex-direction:column;gap:14px}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font:600 10.5px/1 var(--font-mono);letter-spacing:.12em;
  color:var(--accent);text-transform:uppercase}
.hero-team{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:650}
.hero-score{font:700 42px/1 var(--font-mono);letter-spacing:-.03em}
.hero-vs{font:700 22px/1 var(--font-mono);color:var(--text-3)}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero-main{border-right:0;border-bottom:1px solid var(--line)}}

.league-tile{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);transition:.18s;width:100%;text-align:left}
.league-tile:hover{border-color:#c9d4e0;background:var(--panel-3)}
.league-tile.on{border-color:rgba(47,134,224,.42);background:var(--accent-soft)}
.league-tile img{width:24px;height:24px;object-fit:contain;flex:none}
.league-tile .grow{flex:1;min-width:0}
.league-tile b{font-size:13px;font-weight:600;display:block}
.league-tile span{font-size:11px;color:var(--text-3)}

.chart-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.chart-card h4{font-size:12.5px;font-weight:600}
.chart-card .csub{font-size:11px;color:var(--text-3);margin-top:-6px}
.chart-card .ctop{display:flex;align-items:center;gap:8px}
.chart-card .ctop .tag{margin-left:auto}

.check{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(19,26,33,.6);font-size:13px}
.check:last-child{border-bottom:0}
.check .ci{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.check .ci svg{width:13px;height:13px}
.check .ci.ok{background:rgba(47,134,224,.14);color:var(--accent)}
.check .ci.warn{background:rgba(169,116,26,.14);color:var(--amber)}
.check .ci.bad{background:rgba(208,69,60,.14);color:var(--red)}
.check .cv{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-2)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2)}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .lg i{width:10px;height:10px;border-radius:3px;flex:none}

.tool-card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.tool-card .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel-3);color:var(--accent)}
.tool-card .ti svg{width:15px;height:15px}
.tool-card b{font-size:12.5px}
.tool-card span{font-size:11px;color:var(--text-3)}

.api-line{display:flex;gap:8px;align-items:center}
.api-method{font:700 12px/1 var(--font-mono);color:var(--accent);background:var(--accent-soft);border:1px solid rgba(47,134,224,.3);
  padding:9px 11px;border-radius:9px;flex:none}
.endpoint-list{display:flex;flex-direction:column;gap:4px}
.endpoint{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;text-align:left;color:var(--text-2);transition:.15s}
.endpoint:hover{background:var(--panel-2);color:var(--text)}
.endpoint.on{background:var(--accent-soft);color:#17539a}
.endpoint .m{font:700 10px/1 var(--font-mono);color:var(--accent);flex:none}
.endpoint .p{font-family:var(--font-mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.db-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;text-align:left;width:100%;transition:.15s;color:var(--text-2)}
.db-item:hover{background:var(--panel-2);color:var(--text)}
.db-item.on{background:var(--accent-soft);color:#17539a}
.db-item .r{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--text-3)}
.schema-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.schema-col{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:12.5px}
.schema-col .ty{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-3)}
.schema-col .pk{width:16px;height:16px;color:var(--amber);flex:none}

.kpi-row{display:flex;gap:10px;flex-wrap:wrap}
.mini-kpi{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);min-width:120px;flex:1}
.mini-kpi .l{font:600 9.5px/1 var(--font-mono);letter-spacing:.12em;color:var(--text-3);text-transform:uppercase}
.mini-kpi .v{font:600 22px/1.1 var(--font-mono);letter-spacing:-.02em}
.mini-kpi .d{font-size:11px;color:var(--text-3)}

.flagbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--panel-3);margin-top:8px}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:1180px){
  :root{--pad:20px}
  .cols-5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.split-r{grid-template-columns:1fr}
}
@media (max-width:1024px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(82vw,300px);z-index:50;
    transform:translateX(-102%);transition:transform .28s var(--ease-out);box-shadow:var(--shadow)}
  .app.nav-open .sidebar{transform:none}
  .menu-btn{display:grid}
  .cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span-2{grid-column:span 1}
}
@media (max-width:720px){
  :root{--pad:15px;--topbar-h:60px}
  .cols-2,.cols-3,.cols-4,.cols-5{grid-template-columns:1fr}
  .demo-badge{display:none}
  .content{padding-bottom:calc(var(--pad) + 6px)}
  .statusbar{overflow-x:auto}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rise,.radar-poly{opacity:1!important;transform:none!important}
}

/* ============================================================
   26. 参照稿(晴空蓝玻璃仪表盘)设计语言对齐层
   —— 与 docs/console/login.html 同一套玻璃面板 + 参照稿的天蓝强调：
      蓝白纸面 + 白玻璃卡 + 天蓝 #2f86e0 + 衬线展示标题 + 等宽大写微标签。
      只覆盖视觉，不动布局与任何交互逻辑。
   ============================================================ */
body{background:var(--bg);color:var(--text)}

/* 面板 = 白玻璃 + 发丝线 + 大圆角 + 柔投影 */
.panel,.card,.fn-card,.league-tile,.row-item,.tbl-wrap{
  backdrop-filter:blur(10px) saturate(120%);
}
.panel{
  border:1px solid var(--hair);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.panel::before{
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
}
.panel-head{border-bottom:1px solid var(--hair)}

/* 展示体标题：衬线 */
h1,h2,.ph-title,.panel-head h2,.panel-head .title,.brand .b-title,#pageTitle,#pageTitle2{
  font-family:var(--font-display);font-weight:600;letter-spacing:.005em;
}
h1,.ph-title{font-weight:600}
h3,h4,.section-title,.panel-head .sub{font-family:var(--font-sans)}

/* 等宽大写微标签 */
.kicker,.panel-head .cap,.sec-cap,.micro,.eyebrow,.badge,.tag,
.tbl thead th,.kpi .label,.stat .label,.metric .label,.side-cap{
  font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.16em;
}
.tbl thead th{letter-spacing:.14em;color:var(--text-3);background:transparent}
.panel-head .cap,.side-cap{letter-spacing:.22em;font-size:.62rem;color:var(--text-3)}

/* 导航：选中 = 暖色玻璃块 + 左侧暖条 */
.nav-item{border-radius:var(--radius-xs)}
.nav-item.active{
  color:var(--accent-deep);
  background:linear-gradient(90deg,var(--accent-soft),rgba(47,134,224,.03));
  box-shadow:inset 3px 0 0 var(--accent);
}
.nav-item:hover{background:rgba(19,26,33,.04)}

/* 按钮：主按钮暖色渐变 + 内高光 + 悬停暖投影 + 按压 1px */
.btn{border-radius:var(--radius-xs);border:1px solid var(--hair);background:var(--glass)}
.btn:hover{background:#fff;border-color:var(--accent-soft)}
.btn-primary{
  border:0;color:#fff;background:linear-gradient(180deg,#4a9df0 0%,#1f6fc4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 10px 24px -14px rgba(31,111,196,.55);
}
.btn-primary:hover{
  background:linear-gradient(180deg,#5aa9f8 0%,#2f86e0 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 18px 34px -14px rgba(31,111,196,.7);
}
.btn:active{transform:translateY(1px)}

/* 输入控件：白底 + 发丝线 + 暖色聚焦环 */
.input,.select,select,input[type="text"],input[type="search"],textarea{
  background:#fff;border:1px solid var(--hair);border-radius:var(--radius-xs);color:var(--text);
}
.input:focus,.select:focus,select:focus,input:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.input:hover,.select:hover,select:hover{border-color:rgba(19,26,33,.22)}
.segmented{background:var(--panel-3);border:1px solid var(--hair);border-radius:var(--radius-pill)}
.segmented button{border-radius:var(--radius-pill)}
.segmented button.on{background:#fff;color:var(--accent-deep);box-shadow:var(--shadow-sm)}

/* 芯片 / 标签 / 徽标：令牌色 1px 同色描边 */
.chip{border-radius:var(--radius-pill);background:var(--glass)}
.chip:hover{border-color:rgba(19,26,33,.22)}
.chip.on{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
.tag{border-width:1px;border-radius:var(--radius-pill);text-transform:none;letter-spacing:.02em;
  font-family:var(--font-mono)}

/* 表格：发丝分割线 + 悬停暖底 */
.tbl tbody td{border-bottom:1px solid var(--hair)}
.tbl tbody tr:hover{background:rgba(47,134,224,.05)}
.row-item{border-bottom:1px solid var(--hair)}
.check{border-bottom:1px solid var(--hair)}

/* 状态点：3px 淡光晕（与登录页一致） */
.dot.ok{box-shadow:0 0 0 3px rgba(46,158,107,.18)}
.dot.warn{box-shadow:0 0 0 3px rgba(200,135,26,.18)}
.dot.err{box-shadow:0 0 0 3px rgba(208,69,60,.18)}

/* 数值：等宽 tabular */
.kpi .v,.stat .v,.metric .v,.dual .v,.meter .v,.big-num{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
}

/* 进度条 / 仪表：暖色渐变 */
.bar-fill,.meter-fill,.progress-fill{
  background:linear-gradient(90deg,var(--accent),#86c9d8);
}
.meter-fill.dim{background:#cbd5df}

/* 侧栏与顶栏：玻璃 */
.sidebar,.side{background:var(--glass);backdrop-filter:blur(14px);border-right:1px solid var(--hair)}
.topbar,.top{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.brand{color:var(--text)}
.brand .mark,.logo,.brand-mark{
  background:linear-gradient(180deg,#4a9df0,#1f6fc4);color:#fff;
  box-shadow:0 8px 20px -10px rgba(31,111,196,.55);
}

/* 滚动条：浅色 */
::-webkit-scrollbar-thumb{background:#c3d6ea;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#a6bed6}

/* 代码块：浅底深字 */
.code{background:#f6f8fa;color:#2f3b46;border:1px solid var(--hair);border-radius:var(--radius-sm)}
.code .k{color:#17539a}.code .s{color:#8a5c10}.code .n{color:#2c5c80}

/* 图表：网格线/坐标轴跟随令牌 */
.chart .grid-line{stroke:rgba(19,26,33,.10)}
.chart .axis-line{stroke:rgba(19,26,33,.18)}
.chart text{fill:var(--text-3)}

/* 球场示意：改浅草色 */
.pitch{background:repeating-linear-gradient(0deg,#eef5ea,#eef5ea 8.5%,#e4eedd 8.5%,#e4eedd 17%)}
.pitch .line{border-color:rgba(19,26,33,.16)}
.pitch .dot{background:#cfe4f8;color:#17539a;border-color:var(--accent);box-shadow:0 4px 10px -4px rgba(14,28,45,.35)}

/* 遮罩 */
.scrim{background:rgba(19,26,33,.32);backdrop-filter:blur(2px)}

/* 入场：与登录页同一条缓动曲线 */
@keyframes tmRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.main > *,.panel,.fn-card,.league-tile{animation:tmRise .7s var(--ease) both}
.panel:nth-child(2){animation-delay:.07s}
.panel:nth-child(3){animation-delay:.14s}
.panel:nth-child(4){animation-delay:.21s}
@media (prefers-reduced-motion:reduce){
  .main > *,.panel,.fn-card,.league-tile{animation:none}
}

/* 窄栏（DSH 侧边浏览器 ~520px）：内容区与顶栏允许横向滚动，
   避免固定最小宽度的表格/按钮被裁掉后无法查看（只放开滚动，不改宽度、不隐藏内容）。 */
@media (max-width:900px){
  .content{overflow-x:auto}
  .topbar{overflow-x:auto;padding:0 12px;gap:10px}
  .btn,.who,.tb-actions{white-space:nowrap}
}


/* ---------------- 登录闸门(由 build_console.py 注入) ---------------- */
.gate{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  padding:26px;overflow:auto;background:
    radial-gradient(760px 420px at 78% -12%, rgba(47,134,224,.12), transparent 62%),
    radial-gradient(560px 380px at -6% 108%, rgba(63,124,168,.10), transparent 64%),
    var(--bg)}
.gate[hidden]{display:none}   /* 覆盖上面的 display:flex, 否则隐藏后仍会挡住点击 */
.gate-inner{width:100%;max-width:880px;margin:auto}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.gate-brand .m{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:none}
.gate-brand b{font-size:16px;font-weight:700}
.gate-brand small{display:block;font:500 10px/1.6 var(--font-mono);letter-spacing:.2em;
  color:var(--text-3);text-transform:uppercase}
.gate-msg{margin:0;font-size:13px;line-height:1.85;color:var(--text-2)}
.gate-msg.is-err{color:var(--red)}
.gate-foot{margin-top:16px;font:500 10.5px/1.8 var(--font-mono);color:var(--text-3);letter-spacing:.06em}
.gate-foot a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(47,134,224,.35)}
.gate-foot a:hover{border-bottom-color:var(--accent)}
.who{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 10px;
  border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--panel-2)}
.who b{font-size:12.5px;font-weight:600}
.who i{font-style:normal;font:500 10px/1 var(--font-mono);letter-spacing:.1em;color:var(--text-3);text-transform:uppercase}
.who-out{border:0;background:transparent;color:var(--text-3);font:600 11.5px/1 inherit;cursor:pointer;padding:0 4px}
.who-out:hover{color:var(--red)}
</style>
</head>
<body>
<div class="route-progress" id="routeProgress" aria-hidden="true"></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 2.4 28 8.2v15.6L16 29.6 4 23.8V8.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M16 9.5 21.5 13v6L16 22.5 10.5 19v-6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="2.3" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>足球数据 · AI 预测</b>
        <small>管理后台 ADMIN</small>
      </span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="svc-mini" id="svcMini"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar"></button>
      <div class="tb-title">
        <h1 id="viewTitle">首页概览</h1>
        <p id="viewSub"></p>
      </div>
      <div class="tb-actions">
        <span class="demo-badge is-real" title="本页所有数值均由 scripts/build_console.py 从本地 SQLite 直读生成">真实数据</span>
        <span class="who" id="whoBox" hidden>
          <b id="whoName"></b><i id="whoRole"></i>
          <button class="who-out" id="whoOut" title="退出登录">退出</button>
        </span>
        <a class="btn btn-ghost" id="scopeBtn" href="index.html" title="切换到用户端控制台">用户端 ↗</a>
        <button class="btn btn-ghost" id="realBtn" title="在本地已运行的真实系统中打开当前页面">
          <span>真实系统</span>
        </button>
      </div>
    </header>

    <main class="content" id="content" tabindex="-1"></main>

    <footer class="statusbar">
      <div class="sb-left" id="sbServices"></div>
      <div class="sb-right"><span id="sbClock" class="mono"></span></div>
    </footer>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="gate" id="gate">
  <div class="gate-inner">
    <div class="gate-brand">
      <span class="m">&#9917;</span>
      <span><b>足球数据分析与 AI 预测系统 · 控制台</b><small>Checking your session</small></span>
    </div>
    <p class="gate-msg" id="gMsg">正在检查登录状态…</p>
    <div class="gate-foot" id="gFoot">没有自动跳转？<a href="login.html" id="gToLogin">前往登录页 login.html</a></div>
  </div>
</div>

  window.columnChart = function (data, opts) {

    [0, 0.5, 1].forEach(k => {
      const y = 14 + (baseY - 14) * k;
      g += '<line class="grid-line" x1="' + pad + '" y1="' + y + '" x2="' + (w - pad) + '" y2="' + y + '"/>';
    });
    data.forEach((d, i) => {
      const bh = Math.max(2, (d.value / max) * (baseY - 14));
      const x = pad + i * (bw + gap);
      const y = baseY - bh;
      g += '<rect class="bar" style="--i:' + i + '" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh +
        '" rx="4" fill="' + (d.color || 'var(--accent)') + '" opacity="' + (d.dim ? '.5' : '1') + '"/>';
      g += '<text class="axis" x="' + (x + bw / 2) + '" y="' + (h - 8) + '" text-anchor="middle">' + d.label + '</text>';
      g += '<text class="axis" x="' + (x + bw / 2) + '" y="' + (y - 5) + '" text-anchor="middle" fill="var(--text-2)">' + d.display + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="柱状图">' + g + '</svg>';
  };

  let __agId = 0;
  window.areaChart = function (values, opts) {
    opts = opts || {};
    const gid = 'ag' + (++__agId);
    const w = opts.width || 620, h = opts.height || 160, pad = 14;
    const max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    const span = (max - min) || 1;
    const step = (w - pad * 2) / (values.length - 1);
    const pts = values.map((v, i) => [pad + i * step, h - 20 - ((v - min) / span) * (h - 44)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (h - 14) + ' L' + pts[0][0].toFixed(1) + ' ' + (h - 14) + ' Z';
    const color = opts.color || 'var(--accent)';
    let g = '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + color + '" stop-opacity=".28"/>' +

    pts.forEach((p, i) => {
      if (i === pts.length - 1)
        g += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.4" fill="' + color + '"/>';
    });
    const labels = opts.labels || [];
    labels.forEach((l, i) => {
      g += '<text class="axis" x="' + (pad + i * ((w - pad * 2) / (labels.length - 1))) + '" y="' + (h - 2) + '" text-anchor="middle">' + l + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="趋势图">' + g + '</svg>';
  };

  window.donut = function (segs, size) {

  window.heatmap = function (matrix, rowLabels, colLabels, opts) {
    opts = opts || {};

    let html = '<div class="heat" style="grid-template-columns:26px repeat(' + colLabels.length + ',1fr)">';
    html += '<span class="hl"></span>';

      html += '<span class="hl">' + rowLabels[ri] + '</span>';
      row.forEach(v => {
        const a = (v / max) * 0.9 + 0.03;
        html += '<span class="hc" style="background:rgba(' + scale + ',' + a.toFixed(3) + ');color:' +

    });
    html += '</div>';
    return html;
  };

  window.confusion = function (matrix, labels) {
    const max = Math.max.apply(null, matrix.flat());
    let html = '<div class="heat" style="grid-template-columns:52px repeat(3,1fr)">';
    html += '<span class="hl"></span>' + labels.map(l => '<span class="hl">预测 ' + l + '</span>').join('');
    matrix.forEach((row, ri) => {
      const rowSum = row.reduce((a, b) => a + b, 0);
      html += '<span class="hl" style="text-align:right;padding-right:8px">实际 ' + labels[ri] + '</span>';
      row.forEach((v, ci) => {
        const a = (v / max) * 0.9 + 0.03;
        const diag = ri === ci;
        html += '<span class="hc" style="background:rgba(' + (diag ? '47,134,224' : '208,69,60') + ',' +
          (diag ? a : a * 0.55) + ');color:' + (a > 0.5 ? '#131a21' : 'var(--text-2)') + '" title="' +
          (v / rowSum * 100).toFixed(1) + '%">' + v + '</span>';
      });
    });
    html += '</div>';
    return html;
  };

  window.calibChart = function (bins) {
    const w = 520, h = 260, pad = 34;
    let g = '';
    g += '<rect x="' + pad + '" y="' + pad + '" width="' + (w - pad * 2) + '" height="' + (h - pad * 2) + '" fill="none" stroke="rgba(19,26,33,.14)"/>';
    g += '<line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + pad + '" stroke="rgba(19,26,33,.22)" stroke-dasharray="4 4"/>';

/* ---------------- hydration / motion ---------------- */
(function () {
  function countUp(el) {
    const target = parseFloat(el.dataset.val);
    const fixed = parseInt(el.dataset.fixed || '0', 10);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.textContent = fmtNum(target, fixed); return; }
    const dur = 760, t0 = performance.now();
    (function step(t) {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtNum(target * e, fixed);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  window.hydrate = function (root) {
    requestAnimationFrame(() => {
      root.querySelectorAll('[data-w]').forEach(e => { e.style.width = e.dataset.w + '%'; });
      root.querySelectorAll('[data-h]').forEach(e => { e.style.height = e.dataset.h + '%'; });
      root.querySelectorAll('.count').forEach(countUp);
    });
  };

  window.pulseEl = function (el) {
    if (!el) return;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'pulseNum .8s var(--ease-out)';
  };
})();

<script>/* ============================================================
   用户端视图（8）：首页概览 / 联赛数据 / 球队分析 / 球员分析
                    比赛详情 / 比赛预测 / AI 智能分析 / 实时比分

(function () {
  const T = window.TEAMS, L = window.LEAGUES, ST = window.STANDINGS;
  window.VIEWS = window.VIEWS || {};

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function jit(slug, seed) { return (hash(slug + seed) % 1000) / 1000; }

  function standingOf(slug) {
    for (const k in ST) { const r = ST[k].find(x => x[0] === slug); if (r) return { league: k, row: r }; }
    return null;
  }
  function metrics(slug) {
    const t = T[slug] || {};
    const s = standingOf(slug);
    const se = t.season || {};
    const r = t.radar || {};
    const p = (s ? s.row[1] + s.row[2] + s.row[3] : 0) || se.matches || 0;
    const gfP = se.goals_pg != null ? se.goals_pg : (s && p ? +(s.row[4] / p).toFixed(2) : 0);
    const gaP = se.conceded_pg != null ? se.conceded_pg : (s && p ? +(s.row[5] / p).toFixed(2) : 0);
    return {
      gfP: gfP, gaP: gaP, p: p,
      ppg: se.ppg != null ? se.ppg : 0,
      shots: se.shots_pg != null ? se.shots_pg : 0,
      xgF: se.xg_pg != null ? se.xg_pg : 0,
      xgA: se.xga_pg != null ? se.xga_pg : 0,
      squadValue: se.squad_value != null ? se.squad_value / 1e6 : 0,
      radar: {
        进攻: r.s_attack || 0, 防守: r.s_defense || 0, 统治力: r.s_dominance || 0,
        纪律: r.s_discipline || 0, 身价: r.s_value || 0, 经验: r.s_experience || 0
      }
    };
  }

  function teamLine(slug) {
    const t = T[slug];
    return '<div class="team-cell">' + crest(slug, 'crest') + '<span class="nm"><b>' + t.name + '</b></span></div>';
  }
  function probBlock(prob, labels) {
    labels = labels || ['主胜', '平局', '客胜'];
    const cls = ['win', 'draw', 'lose'];
    return '<div class="prob">' +
      '<div class="prob-bar">' + prob.map((p, i) => '<span class="p ' + cls[i] + '" data-w="' + p + '" style="width:0"></span>').join('') + '</div>' +
      '<div class="prob-legend">' + prob.map((p, i) =>
        '<span class="k"><i style="background:' + ['var(--accent)', '#b8c2cc', 'var(--blue)'][i] + '"></i>' + labels[i] +
        '<b class="v">' + p + '%</b></span>').join('') + '</div></div>';
  }
  function fixtureRow(m) {
    const l = L[m.league];
    return '<a class="row-item" href="#/predict" data-goto="predict">' +
      '<span class="tag b" style="flex:none">' + l.name + '</span>' +
      '<div class="team-cell grow" style="justify-content:flex-end;text-align:right">' + T[m.home].name + crest(m.home, 'crest') + '</div>' +

<script>/* ============================================================
   路由 · 导航 · 动效 · 应用外壳
   ============================================================ */
(function () {
  const PAGES = window.PAGES;
  const SCOPE_SLUGS = ["overview","browse","api","database","update","models"];
  const content = document.getElementById('content');
  const nav = document.getElementById('nav');
  const titleEl = document.getElementById('viewTitle');
  const subEl = document.getElementById('viewSub');
  const app = document.getElementById('app');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menuBtn');
  const progress = document.getElementById('routeProgress');
  const realBtn = document.getElementById('realBtn');
  const bySlug = s => PAGES.find(p => p.slug === s) || PAGES[0];

  menuBtn.innerHTML = ico('menu');

  /* ---------------- 侧边导航 ---------------- */
  const groups = {};
  PAGES.forEach(p => (groups[p.group] = groups[p.group] || []).push(p));
  nav.innerHTML = Object.keys(groups).map(g =>
    '<div class="nav-group">' + g + ' · ' + groups[g].length + '</div>' +
    groups[g].map((p, i) => `<button class="nav-item" data-slug="${p.slug}" title="${p.label}">
      ${ico(p.icon)}<span class="nav-label">${p.label}</span><span class="nav-key mono">${String(i + 1).padStart(2, '0')}</span>
    </button>`).join('')
  ).join('');

  /* ---------------- 服务状态 ---------------- */
  const dotFor = s => '<span class="dot ' + (s === 'ok' || s === 'live' ? (s === 'live' ? 'live' : 'ok') : 'warn') + '"></span>';
  document.getElementById('svcMini').innerHTML = window.SERVICES.map(s =>
    '<div class="row">' + dotFor(s.status) + '<span>' + s.name + '</span><span class="port">' + s.port + '</span></div>').join('');
  document.getElementById('sbServices').innerHTML = window.SERVICES.map(s =>
    '<span class="s">' + dotFor(s.status) + s.name + ' · <b class="mono" style="color:var(--text-2)">' + s.port + '</b></span>').join('');

  /* ---------------- 时钟 ---------------- */
  const clock = document.getElementById('sbClock');
  function tickClock() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    clock.textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tickClock(); setInterval(tickClock, 1000);

  /* ---------------- 路由 ---------------- */
  let current = null, cleanup = null;
  let realUrl = 'http://127.0.0.1:8501/?page=home';

  function setActive(slug) {
    nav.querySelectorAll('.nav-item').forEach(it => it.classList.toggle('active', it.dataset.slug === slug));
  }
  function startProgress() {
    progress.classList.remove('done');
    progress.style.width = '0'; progress.classList.add('on');
    requestAnimationFrame(() => { progress.style.width = '72%'; });
  }
  function endProgress() {
    progress.classList.add('done');
    setTimeout(() => { progress.classList.remove('on', 'done'); progress.style.width = '0'; }, 520);
  }

  function go(slug, push) {
    if (!SCOPE_SLUGS.includes(slug)) slug = SCOPE_SLUGS[0];
    slug = slug || 'home';
    if (!window.VIEWS[slug]) slug = 'home';
    if (cleanup) { try { cleanup(); } catch (e) { } cleanup = null; }

    startProgress();
    const v = window.VIEWS[slug], page = bySlug(slug);
    current = slug;
    content.innerHTML = v.html();
    const view = content.querySelector('.view');
    if (view) { view.style.animation = 'viewIn .34s var(--ease-out) both'; }
    content.scrollTop = 0;
    hydrate(content);
    if (v.mount) cleanup = v.mount(content) || null;

    setActive(slug);
    titleEl.textContent = page.label;
    subEl.textContent = page.desc + ' · ' + page.group;
    document.title = page.label + ' · 足球数据分析与 AI 预测系统';
    realUrl = 'http://127.0.0.1:' + page.port + '/?page=' + page.slug;
    if (push !== false && location.hash !== '#' + slug) history.replaceState(null, '', '#' + slug);
    requestAnimationFrame(endProgress);
  }

  /* ---------------- 抽屉导航 ---------------- */
  function openDrawer() { app.classList.add('nav-open'); scrim.hidden = false; requestAnimationFrame(() => scrim.classList.add('show')); menuBtn.setAttribute('aria-expanded', 'true'); }
  function closeDrawer() { app.classList.remove('nav-open'); scrim.classList.remove('show'); menuBtn.setAttribute('aria-expanded', 'false'); setTimeout(() => { if (!app.classList.contains('nav-open')) scrim.hidden = true; }, 220); }
  menuBtn.addEventListener('click', () => app.classList.contains('nav-open') ? closeDrawer() : openDrawer());
  scrim.addEventListener('click', closeDrawer);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('resize', () => { if (window.innerWidth > 1024) closeDrawer(); });

  /* ---------------- 事件委托 ---------------- */
  nav.addEventListener('click', e => {
    const b = e.target.closest('.nav-item'); if (!b) return;
    closeDrawer();
    if (b.dataset.slug === current) return;
    location.hash = b.dataset.slug;
    go(b.dataset.slug);
  });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-goto]'); if (!a) return;
    e.preventDefault();
    closeDrawer();
    const slug = a.dataset.goto;
    go(slug);
  });
  realBtn.addEventListener('click', () => {
    let url = realUrl;
    // 把当前登录令牌带给真实系统(Streamlit 端会向后端核对一次)
    try {
      const s = JSON.parse(localStorage.getItem('fauth') || 'null');
      if (s && s.token) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'auth_token=' + encodeURIComponent(s.token);
    } catch (e) {}
    let w = null;
    try { w = window.open(url, '_blank', 'noopener'); } catch (e) { w = null; }
    if (!w) {
      // 沙箱/侧边栏环境可能拦截新窗口，此时在当前标签内直接打开真实系统页面
      realBtn.textContent = '正在打开…';
      location.href = url;
    }
  });

  window.addEventListener('hashchange', () => {
    const slug = (location.hash || '').replace('#', '') || 'home';
    if (slug !== current) go(slug, false);
  });

  /* ---------------- 初始化 ---------------- */
  const initial = (location.hash || '').replace('#', '') || 'home';
  go(initial === '__all' ? 'home' : initial, false);
})();
</script>

<script>/* 登录闸门: 控制台只负责会话检查; 登录界面已换成用户新做的 login.html(同源, localStorage.fauth 互通) */
(function () {
  // 后端基址: 本体由 8000 提供时走相对路径(同源); 8591 静态服务 / file:// 时回落到 8000。
  // 部署到域名(含 https 反向代理)时必须同源, 否则浏览器会拦混合内容。
  var API = '';
  try {
    if (location.protocol === 'file:') API = 'http://127.0.0.1:8000';
    else if (location.protocol !== 'https:' && location.port && location.port !== '8000')
      API = 'http://' + (location.hostname || '127.0.0.1') + ':8000';
  } catch (e) { API = ''; }
  window.FA_API = API;   // 供「API 接口测试」视图复用, 避免示例地址写死 127.0.0.1
  var KEY = 'fauth';
  var gate = document.getElementById('gate');
  var msg = document.getElementById('gMsg');

  function saved() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function token() { var s = saved(); return (s && s.token) ? s.token : ''; }
  function dropToken() { try { localStorage.removeItem(KEY); } catch (e) {} }

  // 未登录/会话失效 -> 整页交给登录页; 登录成功后由 login.html 按 ?next= 回到这里(带原 #hash)
  function selfName() { return location.pathname.replace(/^.*\//, '') || 'index.html'; }
  function toLogin(why) {
    var next = selfName() + location.hash;
    location.replace('login.html?next=' + encodeURIComponent(next) + (why ? '&why=' + why : ''));
  }

  // 会话通过后的唯一出口: 账号密码与扫码两条路径都汇到这里
  function enter(user) {
    if (!user || user.role !== 'admin') {
      showGate('这个控制台需要管理员账号（当前登录：' + ((user && (user.display_name || user.username)) || '未知') + '）', true);
      var lk = document.getElementById('gToLogin');
      if (lk) { lk.href = 'login.html?next=' +
        encodeURIComponent(selfName() + location.hash) + '&why=role'; }
      return;
    }
    gate.hidden = true;
    var box = document.getElementById('whoBox');
    if (!box) return;
    box.hidden = false;
    document.getElementById('whoName').textContent = user.display_name || user.username;
    document.getElementById('whoRole').textContent = (user.role === 'admin') ? 'ADMIN' : 'USER';
    document.getElementById('whoOut').onclick = function () {
      fetch(API + '/api/auth/logout', {method: 'POST',
        headers: {'Authorization': 'Bearer ' + token()}}).catch(function () {});
      dropToken();
      location.replace('login.html');
    };
  }

  function showGate(text, isErr) {
    gate.hidden = false;
    if (text) { msg.textContent = text; msg.className = 'gate-msg' + (isErr ? ' is-err' : ''); }
    // 「前往登录页」始终带着本页作为回跳目标, 免得管理员在后台被拦下后点过去又落到用户端
    var link = document.getElementById('gToLogin');
    if (link) { link.href = 'login.html?next=' + encodeURIComponent(selfName() + location.hash); }
  }

  (function boot() {
    var t = token();
    if (!t) { toLogin(''); return; }
    fetch(API + '/api/auth/me', {headers: {'Authorization': 'Bearer ' + t}})
      .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function (j) {
        if (j && j.user) { enter(j.user); return; }
        dropToken();
        toLogin('expired');
      })
      .catch(function () {
        // 接口没起来时不要把人推到登录页再卡一次: 就地说明原因
        showGate('连不上接口 ' + API + '（请先运行 scripts\\start_all.ps1 启动服务）', true);
      });
  })();
})();
</script>
